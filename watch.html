<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Linggo 手表能力探针</title>
<!-- 刻意不引任何外部资源。Google Fonts 那个 <link> 在本项目里出过事故：
     它会把 HTML 解析器卡在 <script> 之前，整段脚本一行都不执行。
     手表浏览器多半走代理/受限网络，更不能赌外部请求。 -->
<style>
  :root{ color-scheme:dark; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{
    margin:0; padding:10px 8px 24px;
    background:#000; color:#fff;
    font:15px/1.35 -apple-system,system-ui,sans-serif;
  }
  h1{ font-size:15px; margin:0 0 8px; color:#ffd24a; font-weight:600; }
  /* 默认就把"JS 没跑"写在页面里。如果表上看到的是这句，答案就已经出来了：
     那个浏览器没有 JS 运行时，Linggo 不可能在上面跑。 */
  #verdict{
    font-size:17px; font-weight:700; line-height:1.3;
    padding:8px; border-radius:8px;
    background:#7f1d1d; color:#fff; margin-bottom:10px;
  }
  .row{ display:flex; gap:6px; padding:5px 0; border-bottom:1px solid #222; align-items:baseline; }
  .k{ color:#9ca3af; flex:0 0 auto; }
  .v{ color:#fff; word-break:break-all; flex:1 1 auto; }
  .ok{ color:#4ade80; font-weight:700; }
  .no{ color:#f87171; font-weight:700; }
  button{
    display:block; width:100%; margin:10px 0 0;
    padding:14px 8px; font:600 16px/1 -apple-system,system-ui,sans-serif;
    background:#1d4ed8; color:#fff; border:0; border-radius:10px;
  }
  #sum{
    margin-top:12px; padding:8px; border-radius:8px;
    background:#111827; color:#ffd24a;
    font:700 14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
    word-break:break-all;
  }
  .hint{ color:#9ca3af; font-size:13px; margin-top:10px; line-height:1.4; }
</style>
</head>
<body>

<h1>Linggo · 手表能力探针</h1>

<!-- 这段文字只有在 JS 没有执行时才会留在屏幕上 -->
<div id="verdict">JS 没有运行<br><span style="font-weight:400;font-size:14px">
这个浏览器只是把页面画出来，不执行脚本 —— 这就是结论，Linggo 跑不了。</span></div>

<div id="out"></div>

<button id="tapbtn">① 点我一下</button>
<button id="crownbtn" style="background:#374151">② 然后转一下表冠</button>
<!-- 表冠不发 wheel 事件，和表冠根本滚不动页面，是两件完全不同的事：
     很多环境里表冠由系统直接滚原生滚动容器，页面会动但 DOM 收不到 wheel。
     这个测试就是把这两者分开——它决定长列表能不能用。 -->
<button id="crowntest" style="background:#7c2d12">③ 表冠专项测试（6 秒）</button>
<div id="crownres" class="hint" style="color:#ffd24a">点 ③ 之后：<b>手指离开屏幕，只转表冠</b></div>

<!-- 以下三个按钮回答"手表上闪卡为什么没声音"——已知网络是通的（clip.bin 200 且
     字节数对得上），死在播放这一步；这三个按钮把播放这一步拆成三条独立的链路分别测,
     互不替代：WAV 不需要解码器、speechSynthesis 是另一套完全独立的 API、
     Kokoro 服务端是线上实际在用的引擎，三者只要有一条通，闪卡就有救。 -->
<button id="wavbtn" style="background:#065f46">④ 测 WAV（本地，不联网）</button>
<div id="wavres" class="hint">点 ④ 现场生成一段正弦波，不发任何请求</div>

<button id="spkbtn" style="background:#1e40af">⑤ 测系统朗读（会出声）</button>
<div id="spkres" class="hint">点 ⑤ 会真的说一句话</div>

<button id="kokbtn" style="background:#7c2d12">⑥ 测 Kokoro 服务器（要等）</button>
<div id="kokres" class="hint">点 ⑥ 才会发出本页唯一一次外部请求</div>

<!-- ⑧：上一轮从④⑥推出"表上 <audio> 整条管线放不出声"被真机实测推翻——
     阅读器里点播放键 Kokoro 是有声音的，说明④⑥没测出问题所在，而是把三个
     互相独立的变量（WAV 格式本身 / 元素有没有被手势"开光" / play() 调用时
     手势是否还有效）混在一起测了。这里一次点击把三者分开单独测。 -->
<button id="w16btn" style="background:#831843">⑧ 测 16 位 WAV × 开光 × 手势</button>
<div id="w16res" class="hint">点 ⑧ 本地生成 16 位 WAV，不发任何请求</div>

<div id="sum">等待 JS…</div>
<div class="hint">把这一行念给我 / 或者截图（侧边按钮+表冠同时按）</div>

<script>
(function(){
  var out = document.getElementById('out');
  var sum = document.getElementById('sum');

  function row(k, v, cls){
    var d = document.createElement('div'); d.className = 'row';
    var a = document.createElement('span'); a.className = 'k'; a.textContent = k;
    var b = document.createElement('span'); b.className = 'v' + (cls ? ' ' + cls : '');
    b.textContent = v;
    d.appendChild(a); d.appendChild(b); out.appendChild(d);
    return b;
  }

  // JS 跑起来了 —— 先把那条红色结论换掉
  var verdict = document.getElementById('verdict');
  verdict.style.background = '#14532d';
  verdict.innerHTML = 'JS 在运行 ✓<br><span style="font-weight:400;font-size:14px">' +
                      '说明这不是截图代理。下面几项决定能做成什么样。</span>';

  // ── 屏幕：适配的第一手依据。S12 46mm 到底给网页多少逻辑像素，只有真机知道
  var W = window.innerWidth, H = window.innerHeight, DPR = window.devicePixelRatio || 1;
  row('视口', W + ' × ' + H + '  (DPR ' + DPR + ')');
  row('屏幕', (screen.width || '?') + ' × ' + (screen.height || '?'));

  // ── 是谁在渲染
  row('UA', (navigator.userAgent || '?').slice(0, 90));

  // ── 存储：生词本和 FSRS 进度全靠它。不能持久化就只能做"只读展示"
  var ls = '✗';
  try { localStorage.setItem('_p', '1'); ls = localStorage.getItem('_p') === '1' ? '✓' : '✗';
        localStorage.removeItem('_p'); } catch(e) { ls = '✗ ' + (e.name || 'err'); }
  row('localStorage', ls, ls.charAt(0) === '✓' ? 'ok' : 'no');

  var idbRow = row('IndexedDB', '测试中…');
  var IDB = '?';
  try {
    var rq = indexedDB.open('_probe', 1);
    rq.onsuccess = function(){ IDB = '✓'; idbRow.textContent = '✓'; idbRow.className = 'v ok';
                               try { rq.result.close(); indexedDB.deleteDatabase('_probe'); } catch(e){} render(); };
    rq.onerror   = function(){ IDB = '✗'; idbRow.textContent = '✗'; idbRow.className = 'v no'; render(); };
  } catch(e) { IDB = '✗'; idbRow.textContent = '✗ ' + (e.name || 'err'); idbRow.className = 'v no'; }

  // ── 朗读：查词发音要用
  var voices = 0;
  try { voices = (window.speechSynthesis && speechSynthesis.getVoices().length) || 0; } catch(e){}
  row('语音合成', window.speechSynthesis ? ('有 · ' + voices + ' 个音源') : '✗ 没有',
      window.speechSynthesis ? 'ok' : 'no');

  // ── 网络：能不能取数据
  var netRow = row('fetch 同源', '测试中…');
  var NET = '?';
  try {
    fetch('manifest.json', { cache: 'no-store' })
      .then(function(r){ NET = r.ok ? '✓' : ('✗ HTTP' + r.status);
                         netRow.textContent = NET; netRow.className = 'v ' + (r.ok ? 'ok' : 'no'); render(); })
      .catch(function(e){ NET = '✗ ' + (e.name || 'fail');
                          netRow.textContent = NET; netRow.className = 'v no'; render(); });
  } catch(e) { NET = '✗'; netRow.textContent = '✗'; netRow.className = 'v no'; }

  // ── 交互：能不能点、表冠能不能当滚轮用（决定闪卡怎么操作）
  var TAP = '✗', CROWN = '✗', MOVE = '✗';
  var tapRow   = row('点击事件', '还没点');
  var crownRow = row('表冠/滚轮', '还没转');
  var moveRow  = row('滑动事件', '还没滑');

  function markTap(kind){
    TAP = '✓'; tapRow.textContent = '✓ ' + kind; tapRow.className = 'v ok';
    document.getElementById('tapbtn').textContent = '① 收到了 ✓';
    render();
  }
  var btn = document.getElementById('tapbtn');
  btn.addEventListener('click', function(){ markTap('click'); });
  btn.addEventListener('touchstart', function(){ markTap('touch'); }, { passive: true });
  btn.addEventListener('pointerdown', function(){ markTap('pointer'); });

  window.addEventListener('wheel', function(e){
    CROWN = '✓';
    crownRow.textContent = '✓ wheel Δ' + Math.round(e.deltaY);
    crownRow.className = 'v ok';
    document.getElementById('crownbtn').textContent = '② 收到了 ✓';
    render();
  }, { passive: true });

  window.addEventListener('touchmove', function(){
    MOVE = '✓'; moveRow.textContent = '✓ touchmove'; moveRow.className = 'v ok'; render();
  }, { passive: true });

  // ── 表冠专项：6 秒窗口内只转表冠、不碰屏幕，看到底有没有东西动
  // 判据分三档，对应三种完全不同的适配结论：
  //   wheel 到了      → 表冠是标准滚轮，可以拿来做自定义交互（翻卡片等）
  //   只有 scroll 动  → 系统在滚，页面能滚但 DOM 收不到输入；长列表可用，但表冠不能自定义
  //   什么都没有      → 表冠对网页完全无效，只能靠手指划，长列表要避免
  var CT = '未测';
  document.getElementById('crowntest').addEventListener('click', function(){
    var btn = this, res = document.getElementById('crownres');
    var w = 0, s = 0, tm = 0, y0 = window.pageYOffset, yMax = y0, yMin = y0;
    function onW(){ w++; } function onS(){ s++;
      var y = window.pageYOffset; if(y > yMax) yMax = y; if(y < yMin) yMin = y; }
    function onT(){ tm++; }
    window.addEventListener('wheel', onW, { passive: true });
    window.addEventListener('scroll', onS, { passive: true });
    window.addEventListener('touchmove', onT, { passive: true });
    var left = 6;
    btn.textContent = '③ 转表冠… ' + left;
    var iv = setInterval(function(){
      left--;
      btn.textContent = left > 0 ? ('③ 转表冠… ' + left) : '③ 测完了';
      if(left > 0) return;
      clearInterval(iv);
      window.removeEventListener('wheel', onW);
      window.removeEventListener('scroll', onS);
      window.removeEventListener('touchmove', onT);
      var moved = Math.round(yMax - yMin);
      CT = 'wheel' + w + '/scroll' + s + '/touch' + tm + '/移动' + moved + 'px';
      var say;
      if (tm > 0)      say = '⚠ 期间碰到屏幕了（touchmove ' + tm + ' 次），结果不算数，请重测';
      else if (w > 0)  say = '✅ 表冠发 wheel 事件（' + w + ' 次）——可以拿来做自定义交互';
      else if (moved > 4) say = '◐ 表冠能滚页面（移动 ' + moved + 'px）但不发 wheel——长列表可用，不能自定义';
      else             say = '❌ 表冠对网页完全无效——只能靠手指划';
      res.innerHTML = say + '<br><span style="color:#9ca3af">' + CT + '</span>';
      render();
    }, 1000);
  });

  // ══════════════════════════════════════════════════════════════════
  // 音频探针：④⑤⑥ 三个按钮回答"手表上闪卡为什么没声音"。
  // 已知网络是通的（clip.bin 200 且字节数对得上），死在播放这一步——
  // 但"死在播放"背后可能是三种完全不同的原因，所以拆成三条独立链路：
  //   ④ 只测裸 PCM（WAV）能不能放，不牵涉任何解码器
  //   ⑤ 只测 speechSynthesis 这一套完全独立于 <audio> 的 API
  //   ⑥ 只测线上实际在用的 Kokoro 引擎端到端能不能通
  // 三者互不替代，任何一条通了，闪卡就有救。
  // ══════════════════════════════════════════════════════════════════
  var WAVd = '?', WAVb = '?', SPK = '?', KOK = '?';
  // ⑧ 的三个子测试结果，独立于④⑤⑥那组，见下方「⑧」小节
  var W16a = '?', W16b = '?', W16c = '?';

  // 三个新按钮共用的"是否真的出声了"判定逻辑，别复制三遍。
  // cb(str, ok)：str 是给人看的完整结果行文字，ok 是 1/0，供汇总行用。
  // 第三个可选参数 el：⑧b/⑧c 要在"同一个已经开过光的元素"上复测，
  // 不能像④⑥那样每次 new Audio()——不传时行为和原来完全一样。
  function probeAudio(url, cb, el){
    var a = el || new Audio();
    var md = 0, dur = 'NaN', playOk = 0, playErr = '', ct = 0, done = false;
    function finish(){
      if(done) return; done = true;
      try{ a.pause(); }catch(e){}
      var errCode = a.error ? a.error.code : '-';
      var playStr = playOk ? '1' : ('0' + (playErr ? '(' + playErr + ')' : ''));
      var str = 'md' + md + ' dur' + dur + ' play' + playStr + ' ct' + ct + ' err' + errCode;
      cb(str, playOk && ct ? 1 : 0);
    }
    a.addEventListener('loadedmetadata', function(){
      md = 1;
      dur = isFinite(a.duration) ? a.duration.toFixed(2) : String(a.duration);
    });
    a.addEventListener('error', function(){ finish(); });
    a.setAttribute('playsinline', '');   // 与 script.js:2791 的真实播放元素保持一致
    a.src = url;
    // 兜底计时器。这次要测的恰恰是一个媒体栈可能整个坏掉的浏览器——万一 play() 的
    // promise 既不 resolve 也不 reject、error 事件也始终不来，没有这道兜底，结果行
    // 就永远停在"测试中…"、按钮永远禁用，用户在表上点了半天什么数都拿不到。
    // 「没有任何反应」本身就是一条重要结论，必须能报出来，不能表现为卡死。
    setTimeout(function(){
      if(!done){ playErr = playErr || '无响应'; finish(); }
    }, 6000);
    var p;
    try { p = a.play(); } catch(e){ playErr = e.name || 'throw'; finish(); return; }
    if(p && typeof p.then === 'function'){
      p.then(function(){
        playOk = 1;
        // play() 的 promise resolve 只说明浏览器"受理"了这次调用，不说明真的在出声——
        // 受限/静音策略下常见 resolve 了但完全没往前播的假成功，只看 play() 会被骗，
        // 延迟 900ms 再读一次 currentTime，>0 才是管线真的跑起来的证据。
        setTimeout(function(){ ct = a.currentTime > 0 ? 1 : 0; finish(); }, 900);
      }, function(e){
        // reject 时的错误名必须原样带出去：NotSupportedError（放不了，编解码/格式问题）
        // 和 NotAllowedError（手势策略挡的，跟格式无关）含义完全不同，混在一起就白测了。
        playErr = (e && e.name) || 'err'; finish();
      });
    } else {
      // 极老 WebKit 的 play() 不返回 promise，退化成只看延迟后的 currentTime。
      setTimeout(function(){ ct = a.currentTime > 0 ? 1 : 0; finish(); }, 900);
    }
  }

  // ── ④ WAV 本地播放：现场生成 PCM，不嵌一大坨 base64 常量进 HTML
  // 8 位无符号单声道 8000Hz——体积最小、兼容性最高，只是用来问"能不能放裸 PCM"，
  // 不追求音质。
  function makeWavBytes(){
    var sr = 8000, sec = 0.6, n = Math.round(sr * sec);
    var buf = new Uint8Array(44 + n);
    function w32(off, v){ buf[off]=v&255; buf[off+1]=(v>>8)&255; buf[off+2]=(v>>16)&255; buf[off+3]=(v>>24)&255; }
    function w16(off, v){ buf[off]=v&255; buf[off+1]=(v>>8)&255; }
    function wstr(off, s){ for(var i=0;i<s.length;i++) buf[off+i]=s.charCodeAt(i); }
    wstr(0,'RIFF'); w32(4, 36+n); wstr(8,'WAVE');
    wstr(12,'fmt '); w32(16,16); w16(20,1); w16(22,1); w32(24,sr); w32(28,sr); w16(32,1); w16(34,8);
    wstr(36,'data'); w32(40, n);
    for(var i=0;i<n;i++){
      var s = Math.sin(2*Math.PI*440*(i/sr));
      buf[44+i] = Math.round((s*0.5+0.5)*255); // 8 位无符号，128 是静音中点
    }
    return buf;
  }
  function bytesToBase64(bytes){
    var bin = '';
    for(var i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }

  // 16 位有符号小端、单声道、44100Hz——这是通用基线格式。④ 用的 8 位 8kHz 是
  // 最冷门的一种 PCM，"体积最小所以兼容性最高"当时那个判断是反的，
  // 很多解码器只实现 16 位，④ 那个 err4 很可能字面上就是对的。
  //
  // 注意：别拿阅读器那段开光静音 WAV 当"16 位能放"的佐证——实际解码它的字节头
  // 得到的是 bitsPerSample=8（而且 blockAlign=4 / byteRate=88200 与 8 位单声道
  // 自相矛盾，是个畸形头）。它能"生效"很可能只是因为 play() 在手势里被**调用**过，
  // 成没成功都被 .catch() 吞了。所以格式这个变量只能靠 ④ 和 ⑧a 的实测差异来判，
  // 不能靠推理。
  // 不改 makeWavBytes()（8 位那个）本身——④ 的结果要留着当对照组，
  // ④ 和 ⑧a 的差异本身就是"格式"这一个变量单独变化后的证据。
  function makeWavBytes16(){
    var sr = 44100, sec = 0.5, n = Math.round(sr * sec);
    var buf = new Uint8Array(44 + n*2);
    function w32(off, v){ buf[off]=v&255; buf[off+1]=(v>>8)&255; buf[off+2]=(v>>16)&255; buf[off+3]=(v>>24)&255; }
    function w16(off, v){ buf[off]=v&255; buf[off+1]=(v>>8)&255; }
    function wstr(off, s){ for(var i=0;i<s.length;i++) buf[off+i]=s.charCodeAt(i); }
    wstr(0,'RIFF'); w32(4, 36+n*2); wstr(8,'WAVE');
    // blockAlign=2、byteRate=44100*2、bitsPerSample=16——16 位单声道的三个
    // 必须对上的字段，写错任何一个都会变成一份"看着像 WAV、实际解不出来"的
    // 坏文件，验收专门要抄这几个偏移量的实测值就是防这个。
    wstr(12,'fmt '); w32(16,16); w16(20,1); w16(22,1); w32(24,sr); w32(28,sr*2); w16(32,2); w16(34,16);
    wstr(36,'data'); w32(40, n*2);
    for(var i=0;i<n;i++){
      var s = Math.sin(2*Math.PI*440*(i/sr));
      w16(44 + i*2, Math.round(s * 32767)); // 16 位有符号，w16 的按位运算对负数一样成立
    }
    return buf;
  }

  document.getElementById('wavbtn').addEventListener('click', function(){
    var btn = this, res = document.getElementById('wavres');
    btn.disabled = true; btn.textContent = '④ 测试中…';
    var bytes = makeWavBytes();
    var dataUrl = 'data:audio/wav;base64,' + bytesToBase64(bytes);
    // 同一段 PCM 分别包成 data: 和 blob: 两种 URL 单独测——blob: 和 Kokoro
    // （script.js:4690）用的是完全同一种形式，万一是"blob 对象 URL 被限制"而不是
    // "PCM 解码不了"，这两种失败原因对应的修复方案完全不同，混在一起测不出来。
    var blobUrl = URL.createObjectURL(new Blob([bytes], { type: 'audio/wav' }));
    res.textContent = 'data: 测试中…';
    probeAudio(dataUrl, function(strD, okD){
      WAVd = okD;
      res.innerHTML = 'data: ' + strD + '<br>blob: 测试中…';
      probeAudio(blobUrl, function(strB, okB){
        WAVb = okB;
        try { URL.revokeObjectURL(blobUrl); } catch(e){}
        var concl;
        if(okD && okB) concl = '✅ WAV 能放，Kokoro 有戏';
        else if(okD && !okB) concl = '◐ PCM 能放但 blob: 被限制——Kokoro 得改成 data: URI';
        else concl = '❌ 连 WAV 都放不了，音频这条路整个断了';
        res.innerHTML = 'data: ' + strD + '<br>blob: ' + strB + '<br>' + concl;
        btn.disabled = false; btn.textContent = '④ 测 WAV（本地，不联网）';
        render();
      });
    });
  });

  // ── ⑤ speechSynthesis 真说一句话
  document.getElementById('spkbtn').addEventListener('click', function(){
    var res = document.getElementById('spkres');
    if(!window.speechSynthesis){
      res.textContent = '✗ 这个浏览器没有 speechSynthesis';
      SPK = 0; render();
      return;
    }
    var btn = this;
    btn.disabled = true; btn.textContent = '⑤ 测试中…';
    var vCount = 0;
    try { vCount = speechSynthesis.getVoices().length; } catch(e){}
    var t0 = Date.now();
    var st = { start:'-', end:'-', err:'-', errName:'', c100:'', c3000:'', concl:'' };
    function paint(){
      // 三个数字都是"第几毫秒触发的"，带上 ms 单位——否则 err14(synthesis-failed)
      // 看起来像"错误码 14"，而用户是要把这行念给我 / 截图给我的，歧义要在源头消掉。
      var ms = function(v){ return v === '-' ? '-' : (v + 'ms'); };
      var lines = ['音源' + vCount + ' start' + ms(st.start) + ' end' + ms(st.end) +
        ' err' + ms(st.err) + (st.errName ? '(' + st.errName + ')' : '')];
      if(st.c100) lines.push(st.c100);
      if(st.c3000) lines.push(st.c3000);
      if(st.concl) lines.push(st.concl);
      res.innerHTML = lines.join('<br>');
    }
    paint();
    // iOS 上不先 cancel() 经常第二次朗读直接哑掉——残留的旧 utterance 会卡住队列。
    try { speechSynthesis.cancel(); } catch(e){}
    var started = false;
    var u = new SpeechSynthesisUtterance('hello, this is a test');
    u.onstart = function(){ started = true; st.start = Date.now() - t0; paint(); };
    u.onend   = function(){ st.end = Date.now() - t0; paint(); };
    u.onerror = function(e){ st.err = Date.now() - t0; st.errName = (e && e.error) || '?'; paint(); };
    // 必须在 click 处理函数内部同步调用 speak()——"允许发声"这件事在很多浏览器里
    // 是绑在用户手势当次调用栈上的，哪怕只隔一个 setTimeout/Promise.then 再调用，
    // 都可能被当成"不是用户直接触发"而静默拒绝，所以这里绝不能包一层异步。
    try { speechSynthesis.speak(u); } catch(e){}
    setTimeout(function(){
      st.c100 = '+100ms speaking' + (speechSynthesis.speaking?1:0) + ' pending' + (speechSynthesis.pending?1:0);
      paint();
    }, 100);
    setTimeout(function(){
      st.c3000 = '+3000ms speaking' + (speechSynthesis.speaking?1:0) + ' pending' + (speechSynthesis.pending?1:0);
      paint();
    }, 3000);
    setTimeout(function(){
      btn.disabled = false; btn.textContent = '⑤ 测系统朗读（会出声）';
      if(st.errName){ st.concl = '⚠ onerror: ' + st.errName; SPK = 0; }
      else if(started){ st.concl = '✅ 系统朗读可用（听到声音了吗？）'; SPK = 1; }
      else { st.concl = '❌ 调用了但没有任何事件——多半是空壳 API'; SPK = 0; }
      paint();
      render();
    }, 4000);
  });

  // ── ⑥ 直接打 Kokoro 接口 + 端到端播放
  // 这是本页唯一允许发外部请求的地方——它本身就是测试目标，
  // 「除第⑥个按钮外零外部资源」这条铁律不适用于这一处，是刻意的例外。
  document.getElementById('kokbtn').addEventListener('click', function(){
    var btn = this, res = document.getElementById('kokres');
    btn.disabled = true;
    var t0 = Date.now();
    btn.textContent = '⑥ 请求中… 0s';
    var iv = setInterval(function(){
      btn.textContent = '⑥ 请求中… ' + Math.floor((Date.now() - t0) / 1000) + 's';
    }, 500);
    // 屏幕只有 320px 宽，这里只留一句话。放宽到 60 秒的理由写在下面 setTimeout 那儿，
    // 那是给读代码的人看的，不该占掉手表上本来就不够用的可视高度。
    res.textContent = '请求中…（冷启动可能要几十秒，最多等 60 秒）';
    function finishKok(msg, ok){
      clearInterval(iv);
      KOK = ok ? 1 : 0;
      res.innerHTML = msg;
      btn.disabled = false; btn.textContent = '⑥ 测 Kokoro 服务器（要等）';
      render();
    }
    var ac = new AbortController();
    // 60 秒而不是线上那档的 3.5 秒（script.js:2829 的 Promise.race）：那个短超时是为了
    // 不卡住阅读体验而设的，但它本身就是"手表上没声音"的怀疑对象之一。卡着 3.5 秒量，
    // 只会量出"被自己的超时掐死了"，量不出 HF Space 冷启动真实要多久。
    var timer = setTimeout(function(){ ac.abort(); }, 60000);
    var url = 'https://langhua1998-kokoro.hf.space/tts-timed?text=hello&voice=af_heart&speed=1';
    fetch(url, { signal: ac.signal }).then(function(r){
      if(!r.ok){
        clearTimeout(timer);
        finishKok('❌ HTTP ' + r.status + '，耗时 ' + (Date.now()-t0) + 'ms<br>❌ 服务器这一步就没过去', 0);
        return;
      }
      r.json().then(function(data){
        clearTimeout(timer);
        var elapsed = Date.now() - t0;
        var b64 = (data && data.audio) || '';
        var wlen = (data && Array.isArray(data.words)) ? data.words.length : 0;
        var head = 'HTTP ' + r.status + ' 耗时' + elapsed + 'ms base64长度' + b64.length + ' words' + wlen;
        if(!b64){
          finishKok(head + '<br>❌ 服务器这一步就没过去（没有 audio 字段）', 0);
          return;
        }
        res.innerHTML = head + '<br>解码播放中…';
        // 和 script.js:4686-4690 一模一样的 base64 → Uint8Array → Blob 解码方式，
        // 这样测出来的才是真实播放链路的答案，不是探针自己另写一套逻辑测出来的假结果。
        var bytes;
        try {
          var bin = atob(b64);
          bytes = new Uint8Array(bin.length);
          for(var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
        } catch(e){
          // 这不是规格三类失败之一（那三类是 fetch reject / HTTP 非 2xx / JSON 解析失败），
          // 是拿到合法 JSON 之后 base64 本身解不开——单独标出来，别混进"JSON 解析失败"，
          // 不然会误导成"响应体不是合法 JSON"，其实响应体是合法的，是 audio 字段的内容坏了。
          finishKok(head + '<br>❌ base64 解码失败: ' + (e.name || e), 0);
          return;
        }
        var blobUrl = URL.createObjectURL(new Blob([bytes], { type: 'audio/wav' }));
        probeAudio(blobUrl, function(str, ok){
          try { URL.revokeObjectURL(blobUrl); } catch(e){}
          var concl = ok ? ('✅ Kokoro 端到端可用，耗时 ' + elapsed + ' ms')
                         : ('◐ 音频下下来了（' + elapsed + ' ms）但放不出——问题在播放不在服务器');
          finishKok(head + '<br>' + str + '<br>' + concl, ok);
        });
      }).catch(function(e){
        clearTimeout(timer);
        finishKok('❌ JSON 解析失败: ' + (e.name || e) + '，耗时 ' + (Date.now()-t0) + 'ms', 0);
      });
    }).catch(function(e){
      clearTimeout(timer);
      // fetch 的 reject 既覆盖真正的网络/CORS 失败，也覆盖 AbortController 超时——
      // 超时后 e.name 是 'AbortError'，和真正的网络失败用同一个错误名字段带出去即可，
      // 报告里能一眼看出是等够 60 秒被自己掐的还是根本连不上。
      finishKok('❌ 网络/CORS 失败: ' + ((e && e.name) || 'fail') + '，耗时 ' + (Date.now()-t0) + 'ms', 0);
    });
  });

  // ══════════════════════════════════════════════════════════════════
  // ⑧ 一次点击分离三个互相独立的变量：
  //   a) 格式本身——16 位而不是④那个 8 位，能不能放
  //   b) 元素有没有被"开光"——先在手势内播一段静音 WAV，再换成测试 WAV
  //   c) play() 调用时手势是否还有效——复用 b 开过光的元素，但延迟到手势
  //      过期之后再放，精确复刻闪卡里"await 合成结果之后才 play()"的处境
  // 三者必须分开报，混在一起会像上一轮那样把假阴性当成结论。
  // ══════════════════════════════════════════════════════════════════
  document.getElementById('w16btn').addEventListener('click', function(){
    var btn = this, res = document.getElementById('w16res');
    btn.disabled = true; btn.textContent = '⑧ 测试中…';
    var strA = '', strB = '', strC = '2 秒后播放（等手势过期）…';
    function paint(){
      res.innerHTML = 'a: ' + (strA || '测试中…') + '<br>' +
                       'b: ' + (strB || '测试中…') + '<br>' +
                       'c: ' + strC;
    }
    paint();

    var dataUrl16 = 'data:audio/wav;base64,' + bytesToBase64(makeWavBytes16());

    // a) 全新元素 + 16 位 WAV，在 click 处理函数里同步发起——回答
    // "是不是只要换成 16 位就能放"，其它变量（开光/手势时机）都不引入。
    probeAudio(dataUrl16, function(str, ok){
      W16a = ok; strA = str; paint(); render(); conclude();
    });

    // b) 完全照抄 script.js:4570-4596 的 _unlockAudio() 的做法：同一个元素
    // 先在手势内播一遍那段静音 WAV"开光"，再（仍在同一个手势、同一个调用栈里，
    // 不经过任何 await/setTimeout）把 .src 换成测试 WAV 复用同一元素再放一次。
    // 阅读器就是这么做的，而它在这块表上确认能出声——照抄才能判断"开光"
    // 这一步本身是不是关键，而不是又混进"手势过没过期"这个变量。
    var elB = new Audio();
    elB.setAttribute('playsinline', '');
    elB.src = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQAEAAgAZGF0YQIAAAAA';
    try { elB.play().catch(function(){}); } catch(e){}
    probeAudio(dataUrl16, function(str, ok){
      W16b = ok; strB = str; paint(); render(); conclude();
    }, elB);

    // c) 复用 b 那个已经开过光的元素，但等 2 秒——让手势彻底过期——再放。
    // 这条最重要：它精确复刻闪卡的处境（先 await 合成结果，再 play()，
    // play() 落在手势之外），回答"修法要不要把合成挪到点击之前预缓存"。
    setTimeout(function(){
      probeAudio(dataUrl16, function(str, ok){
        W16c = ok; strC = str; paint(); render(); conclude();
        btn.disabled = false; btn.textContent = '⑧ 测 16 位 WAV × 开光 × 手势';
      }, elB);
    }, 2000);

    // 三个子测试异步完成的先后顺序不固定（c 延迟 2 秒起步，但 a/b 万一撞上
    // 6 秒兜底也可能比 c 晚），所以每次回调都尝试一次，等三个都拿到 0/1
    // 才真正下结论、只下一次。
    var concluded = false;
    function conclude(){
      if(concluded) return;
      if(W16a === '?' || W16b === '?' || W16c === '?') return;
      concluded = true;
      var lines = [];
      if(W16a) lines.push('✅ 换成 16 位就能放——④ 的 err4 是我的探针格式选错了，不是表的问题');
      else if(W16b) lines.push('◐ 关键是"开光"：元素必须在手势里先播一段静音 WAV');
      if(W16b && !W16c) lines.push('⚠ 手势过期就放不了——合成必须挪到点击之前（预缓存）');
      else if(W16b && W16c) lines.push('✅ 开光后手势过期也能放——只要复用开过光的元素就够了');
      if(!W16a && !W16b) lines.push('❌ 三种都不行，另想办法');
      res.innerHTML = res.innerHTML + '<br>' + lines.join('<br>');
    }
  });

  // ── 一行汇总，方便你念给我或者截图
  function render(){
    sum.textContent = 'W' + W + ' H' + H + ' DPR' + DPR +
                      ' LS' + (ls.charAt(0) === '✓' ? 1 : 0) +
                      ' IDB' + (IDB === '✓' ? 1 : IDB === '?' ? '?' : 0) +
                      ' TTS' + (window.speechSynthesis ? voices : 0) +
                      ' NET' + (NET === '✓' ? 1 : NET === '?' ? '?' : 0) +
                      ' TAP' + (TAP === '✓' ? 1 : 0) +
                      ' CROWN' + (CROWN === '✓' ? 1 : 0) +
                      ' MOVE' + (MOVE === '✓' ? 1 : 0) +
                      '  [表冠 ' + CT + ']' +
                      '  WAVd' + WAVd + ' WAVb' + WAVb + ' SPK' + SPK + ' KOK' + KOK +
                      ' W16a' + W16a + ' W16b' + W16b + ' W16c' + W16c;
  }
  render();

  // 有些 WebKit 要等一拍才填得上音源列表
  if (window.speechSynthesis) {
    speechSynthesis.onvoiceschanged = function(){
      try { voices = speechSynthesis.getVoices().length; } catch(e){}
      render();
    };
  }
})();
</script>
</body>
