<style>
:root{
  --bg:#0c0a09;--fg:#fafaf9;--muted:rgba(250,250,249,.66);--faint:rgba(250,250,249,.42);
  --line:rgba(255,255,255,.09);--glass:rgba(22,18,16,.5);--glass-strong:rgba(22,18,16,.74);
  --hover:rgba(255,255,255,.06);--accent:#fb923c;--love:#f43f5e;--ink:#1c1917;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit}
.ic{width:22px;height:22px;display:block;fill:currentColor}
.ic.stroke{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* 背景：当前封面放大、重度模糊，两层交替淡入淡出 */
.backdrop{position:fixed;inset:0;z-index:-1;overflow:hidden;
  background:radial-gradient(90% 70% at 15% 10%,#7c2d12 0%,transparent 60%),radial-gradient(90% 70% at 90% 95%,#3b0764 0%,transparent 60%),var(--bg)}
.art-bg{position:absolute;inset:-18%;background-size:cover;background-position:center;filter:blur(70px) saturate(1.6) brightness(.72);opacity:0;transition:opacity 1s ease}
.art-bg.show{opacity:1}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,10,9,.2),rgba(12,10,9,.62))}

/* 电脑：左边正在播放，右边歌单 */
.app{display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,470px);gap:48px;height:100vh;height:100dvh;padding:40px 48px}
.stage{--disc:min(420px,38vw,52vh);align-self:center;justify-self:center;width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center}
#close{display:none}
.stage>.edge{position:fixed}
/* 封面做成黑胶唱片：封面是中间的圆标，播放时整张唱片转，暂停就停 */
.cover-wrap{position:relative;width:var(--disc);aspect-ratio:1;border-radius:50%;box-shadow:0 30px 80px rgba(0,0,0,.6);cursor:pointer}
.cover-wrap::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;
  background:conic-gradient(from 30deg,transparent 0 40deg,rgba(255,255,255,.1) 55deg,transparent 75deg 220deg,rgba(255,255,255,.07) 235deg,transparent 255deg)}
.disc{position:absolute;inset:0;border-radius:50%;
  background:repeating-radial-gradient(circle,#141414 0 1.5px,#0a0a0a 1.5px 3px);box-shadow:inset 0 0 0 3px #1c1c1c,inset 0 0 40px rgba(0,0,0,.8);
  animation:spin 24s linear infinite;animation-play-state:paused}
body.playing .disc{animation-play-state:running}
.disc::after{content:"";position:absolute;left:50%;top:50%;width:5%;height:5%;margin:-2.5% 0 0 -2.5%;border-radius:50%;background:var(--bg);box-shadow:0 0 0 2px rgba(0,0,0,.6)}
.label{position:absolute;inset:17%;border-radius:50%;overflow:hidden;background:linear-gradient(135deg,#fdba74,#9a3412);box-shadow:0 0 0 4px #050505}
#art{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .4s}
#art.ready{opacity:1}
.cover-fallback{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(40px,7vw,90px);font-weight:700;color:rgba(255,255,255,.92);text-shadow:0 6px 24px rgba(0,0,0,.25);opacity:0;transition:opacity .3s}
.noart .cover-fallback{opacity:1}
/* 跑马灯：沿着播放页最外圈（手机是整个屏幕边缘，电脑是整个窗口边缘）一圈长条小灯，播放时一串追着跑，颜色一直在变；
   音柱和它用同一个颜色 */
.edge{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.stage>*:not(.edge){position:relative;z-index:1}
#close{z-index:2}
/* 跟着音乐跳的音柱 */
.viz{display:block;width:100%;height:40px;margin-top:14px}
.waking{position:absolute;inset:0;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  background:rgba(0,0,0,.5);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);font-size:14px;color:var(--muted);text-align:center;padding:0 24px}
.spinner{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.now{width:100%;display:flex;flex-direction:column;align-items:center;transition:transform .25s cubic-bezier(.2,.8,.2,1),opacity .25s}
.now.instant,.stage.dragging .now{transition:none}
.meta{width:100%;margin-top:28px;min-width:0;display:flex;align-items:center;gap:10px}
.meta-text{flex:1;min-width:0}
/* 歌词：点唱片（或歌词按钮）把唱片换成歌词，正在唱的那句居中、亮起来，点某一句就跳过去；
   唱片那一面在歌手下面显示正在唱的这一句 */
.lyrics{display:none;position:relative;width:100%;height:var(--disc);overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;touch-action:pan-y;
  -webkit-mask-image:linear-gradient(transparent,#000 15%,#000 85%,transparent);mask-image:linear-gradient(transparent,#000 15%,#000 85%,transparent)}
.lyrics::-webkit-scrollbar{display:none}
body.lyrics-view .cover-wrap{display:none}
body.lyrics-view .lyrics{display:block}
.lyrics ol{list-style:none;margin:0;padding:calc(var(--disc) / 2 - 20px) 0;text-align:center}
.lyrics li{padding:7px 12px;font-size:18px;font-weight:600;line-height:1.45;color:var(--faint);transition:color .3s,transform .3s}
.lyrics:not(.synced) li{color:var(--muted)}
.lyrics.synced li[data-i]{cursor:pointer}
.lyrics li.on{color:var(--fg);transform:scale(1.06)}
.lyrics li.gap{height:12px;padding:0}
.lyrics li.note{font-size:14px;font-weight:400;color:var(--faint)}
.lyrics li.retry{cursor:pointer;text-decoration:underline}
.ln{min-height:1.5em;margin-top:6px;font-size:14px;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
body.lyrics-view .ln{visibility:hidden}
.t{font-size:24px;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a{font-size:17px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.progress{width:100%;margin-top:20px}
.times{display:flex;justify-content:space-between;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums;margin-top:4px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;margin:0;background:transparent;cursor:pointer;--p:0%}
input[type=range]:focus{outline:none}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:99px;background:linear-gradient(to right,rgba(255,255,255,.92) var(--p),rgba(255,255,255,.2) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-4.5px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.45);opacity:0;transition:opacity .15s}
input[type=range]:hover::-webkit-slider-thumb,input[type=range]:active::-webkit-slider-thumb,input[type=range]:focus-visible::-webkit-slider-thumb{opacity:1}
input[type=range]::-moz-range-track{height:5px;border-radius:99px;background:rgba(255,255,255,.2)}
input[type=range]::-moz-range-progress{height:5px;border-radius:99px;background:rgba(255,255,255,.92)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:#fff}
@media (hover:none){input[type=range]::-webkit-slider-thumb{opacity:1}}
.controls{width:100%;display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.icon{display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:50%;background:none;cursor:pointer;opacity:.86;transition:background .15s,opacity .15s,transform .15s}
.icon:active{transform:scale(.92)}
.icon.big .ic{width:30px;height:30px}
.icon[aria-pressed=true]{color:var(--accent);opacity:1}
.icon .one{font-size:9px;font-weight:800;position:absolute;margin:1px 0 0 1px}
#repeat{position:relative}
.play{position:relative;display:grid;place-items:center;width:70px;height:70px;border:0;border-radius:50%;background:var(--fg);color:var(--ink);cursor:pointer;
  box-shadow:0 12px 32px rgba(0,0,0,.4);transition:transform .15s}
.play .ic{width:30px;height:30px}
.play:active{transform:scale(.94)}
.play.busy::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid rgba(255,255,255,.25);border-top-color:var(--accent);animation:spin .9s linear infinite}
.extras{width:100%;display:flex;align-items:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.vol{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--muted)}
.vol .ic{width:18px;height:18px}
.vol input{width:110px}
/* 收藏的心：空心 → 点一下变实心，弹一下、外面散开一圈 */
.fav{position:relative;flex:none}
.fav[aria-pressed=true]{color:var(--love);opacity:1}
.fav[aria-pressed=true] .ic{fill:currentColor}
#like .ic{width:26px;height:26px}
.fav.pop .ic{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.fav.pop::after{content:"";position:absolute;inset:6px;border-radius:50%;border:2px solid var(--love);pointer-events:none;animation:burst .5s ease-out forwards}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes burst{from{transform:scale(.3);opacity:.9}to{transform:scale(1.5);opacity:0}}

.panel{min-height:0;display:flex;flex-direction:column;border-radius:22px;overflow:hidden;border:1px solid var(--line);
  background:var(--glass);-webkit-backdrop-filter:blur(34px) saturate(1.5);backdrop-filter:blur(34px) saturate(1.5)}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 20px 10px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:44px;height:44px;flex:none;border-radius:13px;display:block;background:#fdfbf6;box-shadow:0 8px 20px rgba(234,88,12,.3)}
h1{font-size:20px;margin:0;line-height:1.2}
.search{display:flex;align-items:center;gap:8px;margin:6px 16px 8px;height:40px;padding:0 12px;border-radius:12px;background:rgba(255,255,255,.07);color:var(--faint)}
.search .ic{width:17px;height:17px;flex:none}
.search input{flex:1;min-width:0;height:100%;border:0;background:none;color:var(--fg);font:inherit;outline:none}
.search input::placeholder{color:var(--faint)}
.tabs{display:flex;gap:8px;margin:0 16px 6px}
.tab{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 14px;border:0;border-radius:99px;background:rgba(255,255,255,.07);color:var(--muted);font-size:13.5px;cursor:pointer;transition:background .15s,color .15s}
.tab[aria-selected=true]{background:var(--fg);color:var(--ink);font-weight:600}
.tab .ic{width:14px;height:14px;fill:var(--love)}
.tab .n{font-variant-numeric:tabular-nums;opacity:.65;font-weight:400}
.list{list-style:none;margin:0;padding:4px 8px 16px;overflow:auto;flex:1;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent}
.row{display:flex;align-items:center;border-radius:12px;transition:background .15s}
.row.on{background:rgba(255,255,255,.1)}
.pick{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:8px 6px 8px 10px;border:0;border-radius:12px;background:none;text-align:left;cursor:pointer}
.row.off .pick{opacity:.42;cursor:not-allowed}
.row .fav{width:40px;height:40px;margin-right:4px;color:var(--faint)}
.row .fav .ic{width:20px;height:20px}
.row .fav[aria-pressed=true]{color:var(--love)}
/* 悬停效果只给有鼠标的设备：触屏上点过的按钮会一直停在 :hover。
   电脑上没收藏的心平时藏着，鼠标移到这一行才出来；手机上一直显示 */
@media (hover:hover){
  .icon:hover{background:var(--hover);opacity:1}
  .tab:hover{background:rgba(255,255,255,.12)}
  .row:hover{background:var(--hover)}
  .row .fav[aria-pressed=false]{opacity:0}
  .row:hover .fav[aria-pressed=false],.row .fav[aria-pressed=false]:focus-visible{opacity:.86}
}
/* 歌单列表：两列大封面，左右排满再往下 */
.list.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px;padding:8px 16px 16px;align-content:start}
.list.grid .row{display:block}
.list.grid .pick{width:100%;flex-direction:column;align-items:stretch;gap:7px;padding:0}
.list.grid .thumb{width:100%;height:auto;aspect-ratio:1;border-radius:14px}
.list.grid .thumb.noart::after{font-size:44px}
.list.grid .info{padding:0 2px}
.list.grid .rt{font-size:14.5px}
/* 歌手页：歌手列表（圆头像 + 几首），点进去是这位歌手的歌，最上面有返回和「播放全部」 */
.thumb.round{border-radius:50%}
.artist-head{display:flex;align-items:center;gap:6px;padding:4px 4px 10px}
.artist-head .who{flex:1;min-width:0}
.artist-head .who b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artist-head .who span{font-size:12.5px;color:var(--faint)}
.playall{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border:0;border-radius:99px;background:var(--accent);color:var(--ink);font-weight:600;cursor:pointer;flex:none}
.playall .ic{width:16px;height:16px}
.thumb{position:relative;width:46px;height:46px;flex:none;border-radius:9px;overflow:hidden;background:linear-gradient(135deg,#57534e,#292524)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .3s}
.thumb img.ready{opacity:1}
.thumb.noart::after{content:attr(data-ch);position:absolute;inset:0;display:grid;place-items:center;font-size:20px;font-weight:700;color:rgba(255,255,255,.92)}
.info{flex:1;min-width:0;display:flex;flex-direction:column}
.rt{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.on .rt{color:var(--accent)}
.ra{font-size:12.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.badge{font-style:normal;font-size:10px;font-weight:700;letter-spacing:.5px;color:var(--accent);border:1px solid rgba(251,146,60,.55);border-radius:4px;padding:0 4px;margin-right:6px;position:relative;top:-1px}
.eq{display:none;align-items:flex-end;gap:2px;width:14px;height:14px;flex:none;margin-right:4px}
.row.on .eq{display:flex}
.eq i{width:3px;height:30%;border-radius:1px;background:var(--accent)}
.row.playing .eq i{animation:eq 1s ease-in-out infinite}
.row.playing .eq i:nth-child(2){animation-delay:.25s}
.row.playing .eq i:nth-child(3){animation-delay:.5s}
@keyframes eq{0%,100%{height:25%}50%{height:100%}}
.status{margin:24px 20px;color:var(--faint);text-align:center;font-size:14px}
.status strong{display:block;margin-bottom:4px;font-size:16px;font-weight:600;color:var(--muted)}
.status button{margin-left:8px;border:1px solid var(--line);border-radius:99px;padding:4px 12px;background:rgba(255,255,255,.06);cursor:pointer}
.skeleton .row{pointer-events:none}
.skeleton .thumb,.skeleton .rt,.skeleton .ra{background:rgba(255,255,255,.07);border-radius:6px;color:transparent}
.skeleton .rt{width:60%;height:14px;margin-bottom:6px}
.skeleton .ra{width:35%;height:11px}

.mini{display:none}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));z-index:50;max-width:calc(100vw - 32px);transform:translate(-50%,-160%);
  padding:10px 16px;border-radius:12px;background:var(--glass-strong);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid var(--line);
  font-size:14px;transition:transform .3s ease,visibility .3s;pointer-events:none;visibility:hidden}
#toast.show{transform:translate(-50%,0);visibility:visible}
#toast.act{pointer-events:auto}
#toast button{margin-left:14px;padding:0;border:0;background:none;color:var(--accent);font-weight:700;cursor:pointer}

/* 手机：平时是歌单 + 底部迷你播放条；点播放条展开全屏「正在播放」。
   整页不滚动，只让歌单面板自己滚：页面一滚，Safari 的地址栏就缩到屏幕底部，这时点底部播放条，
   第一下会被 Safari 拿去展开地址栏，要点第二下才进得去播放页 */
@media (max-width:899px){
  body.sheet-open .panel,body.sheet-open .mini{visibility:hidden}
  .app{display:block;height:100vh;height:100dvh;padding:0}
  .panel{display:block;height:100%;overflow-y:auto;overscroll-behavior:contain;border:0;border-radius:0;background:none;-webkit-backdrop-filter:none;backdrop-filter:none}
  .head{padding:calc(18px + env(safe-area-inset-top)) 16px 8px}
  .list{overflow:visible;padding:4px 6px calc(100px + env(safe-area-inset-bottom))}
  .stage{--disc:min(80vw,44vh,380px);position:fixed;inset:0;z-index:30;max-width:none;align-self:stretch;justify-self:stretch;justify-content:center;padding:calc(56px + env(safe-area-inset-top)) 28px calc(28px + env(safe-area-inset-bottom));
    background:rgba(12,10,9,.28);
    transform:translateY(100%);visibility:hidden;transition:transform .38s cubic-bezier(.2,.8,.2,1),visibility .38s;touch-action:none}
  .stage.open{transform:none;visibility:visible}
  .stage>.edge{position:absolute}
  #close{display:grid;position:absolute;top:calc(8px + env(safe-area-inset-top));left:50%;margin-left:-22px}
  .stage.dragging{transition:none}
  .vol{display:none}
  .t{font-size:22px}
  .mini{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:20;display:flex;align-items:center;gap:4px;padding:8px;
    border-radius:16px;overflow:hidden;background:var(--glass-strong);-webkit-backdrop-filter:blur(30px) saturate(1.4);backdrop-filter:blur(30px) saturate(1.4);
    border:1px solid var(--line);box-shadow:0 14px 34px rgba(0,0,0,.45);cursor:pointer}
  .mini-open{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:0;background:none;padding:0;text-align:left;cursor:pointer}
  .mini .thumb{width:42px;height:42px;border-radius:50%;animation:spin 10s linear infinite;animation-play-state:paused}
  body.playing .mini .thumb{animation-play-state:running}
  .mini-meta{min-width:0;display:flex;flex-direction:column}
  #miniT{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #miniA{font-size:12.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mini .icon{width:40px;height:40px}
  .mini-bar{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(255,255,255,.1)}
  .mini-bar i{display:block;height:100%;width:0;background:var(--accent)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

    <div class="tabs" role="tablist" aria-label="歌单">
      <button class="tab" id="tabAll" type="button" role="tab" aria-selected="true">全部<span class="n" id="nAll"></span></button>
      <button class="tab" id="tabList" type="button" role="tab" aria-selected="false">歌单</button>
      <button class="tab" id="tabFav" type="button" role="tab" aria-selected="false"><svg class="ic"><use href="#i-heart"/></svg>我喜欢<span class="n" id="nFav"></span></button>
      <button class="tab" id="tabArtist" type="button" role="tab" aria-selected="false">歌手</button>
    </div>
    <ol class="list skeleton" id="list"></ol>
    <p class="status" id="status" hidden></p>
  </main>
</div>

<div class="mini" id="mini" hidden>
  <button class="mini-open" id="miniOpen" type="button" aria-label="展开正在播放">
    <span class="thumb" id="miniThumb"><img id="miniArt" alt=""></span>
    <span class="mini-meta"><span id="miniT"></span><span id="miniA"></span></span>
  </button>
  <button class="icon" id="miniPlay" type="button" aria-label="播放"><svg class="ic"><use href="#i-play"/></svg></button>
  <button class="icon" id="miniNext" type="button" aria-label="下一首"><svg class="ic"><use href="#i-next"/></svg></button>
  <div class="mini-bar"><i id="miniProg"></i></div>
</div>
<div id="toast" role="status"></div>
<audio id="audio" preload="none"></audio>

<script>
(function(){
  'use strict';
  function $(id){ return document.getElementById(id); }
  var audio = $('audio'), list = $('list');
  var tracks = [], byId = {}, curId = null, loaded = false;
  var retries = 0, retryTimer = 0, seeking = false, bgFront = 1, toastTimer = 0;
  var narrow = window.matchMedia('(max-width: 899px)');
  // tab：歌单显示「全部」还是「我喜欢」；ctx：正在放的这首是从哪一页点的，上一首/下一首就在那一页里切
  var prefs = { repeat: 'all', shuffle: false, volume: 1, last: null, tab: 'all', ctx: 'all' };
  try { Object.assign(prefs, JSON.parse(localStorage.getItem('xm-prefs') || '{}')); } catch (e) {}
  if(['fav', 'artist', 'list'].indexOf(prefs.tab) < 0) prefs.tab = 'all';
  if(['fav', 'artist', 'list'].indexOf(prefs.ctx) < 0) prefs.ctx = 'all';
  function savePrefs(){ try { localStorage.setItem('xm-prefs', JSON.stringify(prefs)); } catch (e) {} }
  // favs：收藏的消息号，新收藏的在前；pos：正在放的这首在播放顺序里排第几；seen：封面加载过没有
  var favs = readFavs(), pos = 0, seen = {};
  // 歌词：lyr 是当前这首的（lines 是 [[秒, 这句], ...]，没有时间轴时秒是 null）；lyricCache 存这次打开页面后取过的
  var lyr = { id: null, state: 'idle', synced: false, lines: [], els: [], cur: -1, src: '' };
  var lyricCache = {}, lyricsOn = false, userScrollUntil = 0;
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

  function el(tag, cls, text){
    var e = document.createElement(tag);
    if(cls) e.className = cls;
    if(text != null) e.textContent = text;
    return e;
  }
  function fmt(s){
    s = Math.max(0, Math.floor(s || 0));
    var h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), r = String(s % 60).padStart(2, '0');
    return h ? h + ':' + String(m).padStart(2, '0') + ':' + r : m + ':' + r;
  }
  // ?v= 变了，浏览器就不用缓存里的旧封面（换掉台标封面时改过一次）
  function coverUrl(id){ return '/c/' + id + '?v=3'; }
  // 没有封面的歌：按歌名算一个固定的色相，做成渐变色块，上面放歌名第一个字
  function hue(text){
    var h = 7;
    for(var i = 0; i < text.length; i++) h = (h * 31 + text.charCodeAt(i)) >>> 0;
    return h % 360;
  }
  function gradient(t){
    var h = hue(t.title + t.artist);
    return 'linear-gradient(135deg, hsl(' + h + ' 62% 58%), hsl(' + (h + 38) % 360 + ' 70% 30%))';
  }
  function firstChar(t){ return Array.from(t.title.trim() || '🍊')[0]; }
  function artistOf(t){ return t.artist || '小橘音乐'; }
  function setIcon(btn, name, label){
    btn.querySelector('use').setAttribute('href', '#i-' + name);
    if(label) btn.setAttribute('aria-label', label);
  }
  // undo：给了就在提示后面放一个「撤销」按钮
  function toast(msg, undo){
    var t = $('toast');
    t.textContent = msg;
    if(undo){
      var b = el('button', null, '撤销');
      b.type = 'button';
      b.addEventListener('click', function(){ hideToast(); undo(); });
      t.appendChild(b);
    }
    t.classList.toggle('act', !!undo);
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, undo ? 5000 : 3200);
  }
  function hideToast(){ $('toast').classList.remove('show', 'act'); }
  // 先铺好渐变色块；封面加载成功就盖上去，失败（这首没有封面）就留着色块
  function coverImg(img, holder, id){
    var t = byId[id];
    if(t){
      holder.style.background = gradient(t);
      holder.dataset.ch = firstChar(t);
      var fb = holder.querySelector('.cover-fallback');
      if(fb) fb.textContent = firstChar(t);
    }
    img.onerror = function(){ seen[id] = false; holder.classList.add('noart'); img.removeAttribute('src'); };
    img.onload = function(){ seen[id] = true; holder.classList.remove('noart'); img.classList.add('ready'); };
    // 加载过的封面（切页签、搜索时重画歌单）直接显示，不再每张淡入一遍
    holder.classList.toggle('noart', seen[id] === false);
    img.classList.toggle('ready', seen[id] === true);
    if(seen[id] !== false) img.src = coverUrl(id);
  }

  // ── 收藏：存在这台设备的浏览器里（localStorage 的 xm-favs） ──
  function readFavs(){
    try {
      var v = JSON.parse(localStorage.getItem('xm-favs') || '[]');
      if(!Array.isArray(v)) return [];
      return v.filter(function(id, i){ return Number.isInteger(id) && id > 0 && v.indexOf(id) === i; });
    } catch (e) { return []; }
  }
  function saveFavs(){ try { localStorage.setItem('xm-favs', JSON.stringify(favs)); } catch (e) {} }
  function isFav(id){ return favs.indexOf(id) >= 0; }
  // 频道里已经移除的歌不显示，但留着记录
  function favTracks(){ return favs.map(function(id){ return byId[id]; }).filter(Boolean); }
  function toggleFav(id, btn){
    if(!byId[id]) return;
    syncPos();
    var at = favs.indexOf(id);
    if(at < 0){
      favs.unshift(id);
      if(btn) pop(btn);
      toast('已加入「我喜欢」');
    } else {
      favs.splice(at, 1);
      toast('已取消收藏', function(){
        if(isFav(id)) return;
        syncPos();
        favs.splice(Math.min(at, favs.length), 0, id); // 放回原来的位置
        saveFavs();
        favsChanged();
      });
    }
    saveFavs();
    favsChanged();
  }
  // 「我喜欢」页整个重画（多一行或少一行），「全部」页只改心的状态
  function favsChanged(){
    if(loaded && prefs.tab === 'fav') render(); else paintFavs();
  }
  function paintFavs(){
    var rows = list.querySelectorAll('.row[data-id]');
    for(var i = 0; i < rows.length; i++){
      var h = rows[i].querySelector('.fav');
      if(h) h.setAttribute('aria-pressed', String(isFav(Number(rows[i].dataset.id))));
    }
    $('like').setAttribute('aria-pressed', String(curId !== null && isFav(curId)));
    var n = favTracks().length;
    $('nFav').textContent = n ? String(n) : '';
  }
  function pop(btn){
    btn.classList.remove('pop');
    void btn.offsetWidth; // 让动画能再播一次
    btn.classList.add('pop');
    clearTimeout(btn._pop);
    btn._pop = setTimeout(function(){ btn.classList.remove('pop'); }, 600);
  }
  function heart(){
    var b = el('button', 'icon fav');
    b.type = 'button';
    b.setAttribute('aria-label', '收藏');
    b.setAttribute('aria-pressed', 'false');
    b.innerHTML = '<svg class="ic stroke"><use href="#i-heart"/></svg>';
    return b;
  }

  // ── 歌单 ──
  // ── 歌手 ──
  // 「A&B」「A、B」这样合唱的歌，两位歌手底下都有
  function artistsOf(t){
    return String(t.artist || '').split(/[&＆、/,，]| x | feat\.? /i).map(function(a){ return a.trim(); }).filter(Boolean);
  }
  var artistCache = null;
  function artistIndex(){
    if(artistCache) return artistCache;
    var m = {};
    tracks.forEach(function(t){ artistsOf(t).forEach(function(a){ (m[a] = m[a] || []).push(t); }); });
    artistCache = Object.keys(m).map(function(a){ return { name: a, songs: m[a] }; })
      .sort(function(x, y){ return y.songs.length - x.songs.length || x.name.localeCompare(y.name, 'zh'); });
    return artistCache;
  }
  function songsOf(name){
    var hit = artistIndex().filter(function(a){ return a.name === name; })[0];
    return hit ? hit.songs : [];
  }

  // ── 歌单：管理员编好的，按编的顺序；频道里已移除的歌不显示 ──
  var playlists = [];
  function playlistIndex(){
    return playlists.map(function(p){
      return { key: p.id, name: p.name, songs: p.tracks.map(function(id){ return byId[id]; }).filter(Boolean), cover: p.cover };
    }).filter(function(g){ return g.songs.length; });
  }

  // 歌手、歌单都是「一组歌」：先列出所有组，点进去是这一组的歌。kind 是 'artist' 或 'list'
  var OPEN = { artist: 'artist', list: 'list' };      // prefs 里记「正在看哪一组」的字段
  var CTX = { artist: 'ctxArtist', list: 'ctxList' };  // prefs 里记「正在放的歌是从哪一组点的」的字段
  function groups(kind){
    return kind === 'artist' ? artistIndex().map(function(a){ return { key: a.name, name: a.name, songs: a.songs }; }) : playlistIndex();
  }
  function groupOf(kind, key){
    return groups(kind).filter(function(g){ return g.key === key; })[0] || null;
  }
  function openGroup(kind, key){
    prefs[OPEN[kind]] = key;
    savePrefs();
    $('q').value = '';
    paintTabs();
    list.scrollTop = 0;
    render();
  }
  function groupRow(kind, g){
    var li = el('li', 'row');
    li.dataset.group = g.key;
    var b = el('button', 'pick');
    b.type = 'button';
    var th = el('span', kind === 'artist' ? 'thumb round' : 'thumb');
    var img = el('img');
    img.alt = '';
    img.loading = 'lazy';
    th.appendChild(img);
    coverImg(img, th, byId[g.cover] ? g.cover : g.songs[0].id);
    var info = el('span', 'info');
    info.appendChild(el('span', 'rt', g.name));
    info.appendChild(el('span', 'ra', g.songs.length + ' 首'));
    b.appendChild(th); b.appendChild(info);
    b.addEventListener('click', function(){ openGroup(kind, g.key); });
    li.appendChild(b);
    return li;
  }
  function groupHead(kind, g){
    var li = el('li', 'artist-head');
    var back = el('button', 'icon');
    back.type = 'button';
    back.setAttribute('aria-label', kind === 'artist' ? '返回歌手列表' : '返回歌单列表');
    back.innerHTML = '<svg class="ic stroke"><use href="#i-back"/></svg>';
    back.addEventListener('click', function(){ openGroup(kind, null); });
    var who = el('div', 'who');
    who.appendChild(el('b', null, g.name));
    who.appendChild(el('span', null, g.songs.length + ' 首'));
    var all = el('button', 'playall');
    all.type = 'button';
    all.innerHTML = '<svg class="ic"><use href="#i-play"/></svg>播放全部';
    all.addEventListener('click', function(){
      var ps = g.songs.filter(function(t){ return t.playable; });
      if(!ps.length) return;
      prefs.ctx = kind;
      prefs[CTX[kind]] = g.key;
      var first = prefs.shuffle ? ps[Math.floor(Math.random() * ps.length)] : ps[0];
      select(first.id);
      start();
    });
    li.appendChild(back); li.appendChild(who); li.appendChild(all);
    return li;
  }

  function render(){
    var raw = $('q').value.trim(), q = raw.toLowerCase(), fav = prefs.tab === 'fav';
    var kind = prefs.tab === 'artist' || prefs.tab === 'list' ? prefs.tab : null;
    list.textContent = '';
    list.classList.remove('skeleton');
    var shown = 0;
    var g = kind && prefs[OPEN[kind]] != null ? groupOf(kind, prefs[OPEN[kind]]) : null;
    list.classList.toggle('grid', kind === 'list' && !g); // 歌单列表是两列大图
    if(kind && !g){ // 组列表（打开的那组已经没有歌了也回到这里）
      prefs[OPEN[kind]] = null;
      groups(kind).forEach(function(x){
        if(q && x.name.toLowerCase().indexOf(q) < 0) return;
        shown++;
        list.appendChild(groupRow(kind, x));
      });
      $('status').hidden = !!shown;
      $('status').textContent = shown ? '' : q ? '没有找到「' + raw + '」' : kind === 'artist' ? '还没有歌手' : '还没有歌单';
      mark();
      return;
    }
    if(g) list.appendChild(groupHead(kind, g));
    (fav ? favTracks() : g ? g.songs : tracks).forEach(function(t){
      if(q && (t.title + ' ' + t.artist).toLowerCase().indexOf(q) < 0) return;
      shown++;
      list.appendChild(row(t));
    });
    var s = $('status');
    s.hidden = !!shown;
    s.textContent = '';
    if(!shown){
      if(q) s.textContent = (fav ? '「我喜欢」里' : '') + '没有找到「' + raw + '」';
      else if(fav){
        s.appendChild(el('strong', null, '还没有收藏的歌'));
        s.appendChild(document.createTextNode('点歌曲旁边的 ♡，就会收进这里'));
      } else s.textContent = '频道里还没有音频';
    }
    paintFavs();
    mark();
  }

  function row(t){
    var li = el('li', 'row' + (t.playable ? '' : ' off'));
    li.dataset.id = t.id;
    var b = el('button', 'pick');
    b.type = 'button';
    var th = el('span', 'thumb');
    var img = el('img');
    img.alt = '';
    img.loading = 'lazy';
    img.decoding = 'async';
    th.appendChild(img);
    coverImg(img, th, t.id);
    var info = el('span', 'info');
    info.appendChild(el('span', 'rt', t.title));
    var ra = el('span', 'ra');
    if(t.mime === 'audio/flac') ra.appendChild(el('em', 'badge', '无损'));
    ra.appendChild(document.createTextNode(t.playable ? [t.artist, fmt(t.duration)].filter(Boolean).join(' · ') : '暂时不能在网页播放'));
    info.appendChild(ra);
    var eq = el('span', 'eq');
    eq.setAttribute('aria-hidden', 'true');
    eq.appendChild(el('i')); eq.appendChild(el('i')); eq.appendChild(el('i'));
    b.appendChild(th); b.appendChild(info); b.appendChild(eq);
    if(!t.playable) b.disabled = true;
    b.addEventListener('click', function(){ choose(t.id); });
    var h = heart();
    h.addEventListener('click', function(){ toggleFav(t.id, h); });
    li.appendChild(b);
    li.appendChild(h);
    return li;
  }

  function mark(){
    var rows = list.querySelectorAll('.row');
    for(var i = 0; i < rows.length; i++){
      var on = Number(rows[i].dataset.id) === curId;
      rows[i].classList.toggle('on', on);
      rows[i].classList.toggle('playing', on && !audio.paused);
    }
  }

  function skeleton(){
    for(var i = 0; i < 8; i++){
      var b = el('div', 'pick');
      b.appendChild(el('span', 'thumb'));
      var info = el('span', 'info');
      info.appendChild(el('span', 'rt', '.'));
      info.appendChild(el('span', 'ra', '.'));
      b.appendChild(info);
      var li = el('li', 'row');
      li.appendChild(b);
      list.appendChild(li);
    }
  }

  // ── 选歌、播放 ──
  function select(id){
    var t = byId[id];
    if(!t) return;
    curId = id;
    retries = 0;
    clearTimeout(retryTimer);
    setWaking(false);
    audio.src = '/a/' + id;
    $('t').textContent = t.title;
    $('a').textContent = artistOf(t);
    $('miniT').textContent = t.title;
    $('miniA').textContent = artistOf(t);
    coverImg($('art'), $('coverWrap'), id);
    coverImg($('miniArt'), $('miniThumb'), id);
    backdrop(id);
    $('like').hidden = false;
    $('lyricsBtn').hidden = false;
    loadLyrics(id);
    $('like').setAttribute('aria-pressed', String(isFav(id)));
    syncPos();
    $('mini').hidden = false;
    document.title = t.title + ' · 小橘音乐';
    paint(0, t.duration);
    if('mediaSession' in navigator && typeof MediaMetadata !== 'undefined'){
      navigator.mediaSession.metadata = new MediaMetadata({
        title: t.title, artist: artistOf(t), album: '小橘音乐',
        artwork: [{ src: location.origin + coverUrl(id), sizes: '320x320', type: 'image/jpeg' }]
      });
    }
    history.replaceState(null, '', '#' + id);
    prefs.last = id;
    savePrefs();
    mark();
  }

  // 背景换成新封面：先在后面那层载好，再淡入
  function backdrop(id){
    var show = bgFront === 1 ? $('bg2') : $('bg1');
    var hide = bgFront === 1 ? $('bg1') : $('bg2');
    var url = coverUrl(id);
    var probe = new Image();
    probe.onload = function(){
      if(curId !== id) return;
      show.style.backgroundImage = 'url("' + url + '")';
      show.classList.add('show');
      hide.classList.remove('show');
      bgFront = bgFront === 1 ? 2 : 1;
    };
    probe.onerror = function(){
      if(curId !== id) return;
      show.style.backgroundImage = gradient(byId[id]);
      show.classList.add('show');
      hide.classList.remove('show');
      bgFront = bgFront === 1 ? 2 : 1;
    };
    probe.src = url;
  }

  function start(){
    var p = audio.play();
    if(p && p.catch) p.catch(function(){});
  }
  // 从歌单里点歌：之后的上一首/下一首就在当前这一页（全部 / 我喜欢）里切
  function choose(id){
    prefs.ctx = prefs.tab;
    if(CTX[prefs.tab]) prefs[CTX[prefs.tab]] = prefs[OPEN[prefs.tab]];
    savePrefs();
    if(id === curId){ syncPos(); toggle(); return; }
    select(id);
    start();
  }
  function toggle(){
    if(curId === null){
      var f = queue()[0];
      if(f){ select(f.id); start(); }
      return;
    }
    if(audio.paused) start(); else audio.pause();
  }
  function playable(){ return tracks.filter(function(t){ return t.playable; }); }
  // 播放顺序：从「我喜欢」点的歌就在收藏里轮（收藏全取消了就退回全部）
  function queue(){
    if(prefs.ctx !== 'all'){
      var g = CTX[prefs.ctx] ? groupOf(prefs.ctx, prefs[CTX[prefs.ctx]]) : null;
      var fs = (prefs.ctx === 'fav' ? favTracks() : g ? g.songs : []).filter(function(t){ return t.playable; });
      if(fs.length) return fs;
    }
    return playable();
  }
  function syncPos(){
    var q = queue();
    for(var i = 0; i < q.length; i++) if(q[i].id === curId){ pos = i; return; }
  }
  function step(dir, auto){
    var q = queue();
    if(!q.length) return;
    var pick;
    if(prefs.shuffle && q.length > 1){
      do { pick = q[Math.floor(Math.random() * q.length)]; } while(pick.id === curId);
    } else {
      var i = -1;
      for(var k = 0; k < q.length; k++) if(q[k].id === curId){ i = k; break; }
      // 正在放的这首刚被移出播放顺序（在「我喜欢」里取消了收藏）：pos 上现在就是原来的下一首
      var j = i >= 0 ? i + dir : (dir > 0 ? pos : pos - 1);
      if(j >= q.length || j < 0){
        if(auto && prefs.repeat === 'off') return; // 播完最后一首就停
        j = (j % q.length + q.length) % q.length;
      }
      pick = q[j];
    }
    select(pick.id);
    start();
  }

  // ── 歌词 ──
  function loadLyrics(id){
    lyr = { id: id, state: 'loading', synced: false, lines: [], els: [], cur: -1, src: '' };
    renderLyrics();
    if(lyricCache[id]){ gotLyrics(id, lyricCache[id]); return; }
    fetch('/l/' + id).then(function(r){
      if(r.status === 404) return { src: 'none', synced: false, lines: [] };
      if(!r.ok) throw new Error(String(r.status));
      return r.json();
    }).then(function(d){
      lyricCache[id] = d;
      gotLyrics(id, d);
    }).catch(function(){
      if(lyr.id !== id) return;
      lyr.state = 'error';
      renderLyrics();
    });
  }
  function gotLyrics(id, d){
    if(lyr.id !== id) return; // 已经换歌了
    lyr.lines = d.lines || [];
    lyr.synced = !!d.synced && lyr.lines.length > 0;
    lyr.src = d.src;
    lyr.state = lyr.lines.length ? 'ok' : 'none';
    renderLyrics();
    syncLyric(true);
  }
  function renderLyrics(){
    var box = $('lyrics'), ol = $('lyricList');
    ol.textContent = '';
    lyr.els = [];
    lyr.cur = -1;
    box.classList.toggle('synced', lyr.synced);
    box.scrollTop = 0;
    $('lyricNow').textContent = '';
    if(lyr.state !== 'ok'){
      var note = el('li', 'note', { loading: '正在找歌词…', none: '暂无歌词', error: '歌词没取到，点这里再试一次' }[lyr.state] || '');
      if(lyr.state === 'error'){
        note.classList.add('retry');
        note.addEventListener('click', function(){ loadLyrics(lyr.id); });
      }
      ol.appendChild(note);
      return;
    }

      loaded = true;
      $('nAll').textContent = tracks.length ? String(tracks.length) : '';
      // 分享链接 #消息号 优先，其次上次听的；只选中不自动出声（浏览器也不允许）
      var want = Number(location.hash.slice(1)) || prefs.last;
      var first = byId[want] && byId[want].playable ? byId[want] : playable()[0];
      if(first && prefs.ctx === 'fav' && !isFav(first.id)) prefs.ctx = 'all';
      if(first && CTX[prefs.ctx]){ // 上次是从某个歌手/歌单点的：这首还在那一组里才接着在那组里切
        var g = groupOf(prefs.ctx, prefs[CTX[prefs.ctx]]);
        if(!g || g.songs.indexOf(first) < 0) prefs.ctx = 'all';
      }
      paintTabs();
      render();
      if(first) select(first.id);
    }).catch(function(){
      list.textContent = '';
      list.classList.remove('skeleton');
      var s = $('status');
      s.hidden = false;
      s.textContent = '歌单加载失败';
      var retry = el('button', null, '重试');
      retry.type = 'button';
      retry.addEventListener('click', function(){ skeleton(); load(); });
      s.appendChild(retry);
    });
  }

  paintModes();
  paintTabs();
  syncPlay();
  skeleton();
  load();
})();
</script>
</body>
</html>
