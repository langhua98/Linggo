<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录抖音 · 小橘</title>
<style>
:root{--bg:#fff;--fg:#111;--mut:#666;--acc:#fe2c55;--card:#f5f5f7}
@media (prefers-color-scheme:dark){:root{--bg:#111;--fg:#eee;--mut:#999;--card:#1d1d1f}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,system-ui,sans-serif;display:flex;justify-content:center}
main{max-width:420px;width:100%;padding:24px 16px;text-align:center}
h1{font-size:22px;margin:8px 0 4px}p{color:var(--mut);margin:6px 0}
button{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:14px 28px;font-size:17px;margin:18px 0;cursor:pointer}
button:disabled{opacity:.5}
#box{background:var(--card);border-radius:16px;padding:16px;margin-top:8px;display:none}
#qr{width:240px;height:240px;background:#fff;border-radius:8px;image-rendering:pixelated}
#msg{font-weight:600;margin-top:12px}
</style></head><body><main>
<h1>登录抖音</h1>
<p>登录后，小橘能看到你抖音上全部作品（包括最新的），自动转到视频频道。</p>
<button id="go">获取二维码</button>
<div id="box"><img id="qr" alt="二维码"><p>用抖音 App 首页左上角「扫一扫」扫码，在手机上点确认。<br>在手机上看这个页面的话：长按二维码存到相册，再到「扫一扫」里选相册。</p></div>
<p id="msg"></p>
</main><script>
const t = location.hash.slice(1), $ = id => document.getElementById(id);
let timer = null;
function msg(s){ $('msg').textContent = s; }
async function api(a, post){ const r = await fetch(`/dl/${t}/${a}`, post ? {method:'POST'} : {}); return r.json(); }
async function poll(){
  try {
    const s = await api('status');
    if (s.error && !s.status) { msg(s.error); return stop(); }
    if (s.logged_in) { $('box').style.display='none'; msg('✅ 登录成功，服务器已保存。可以关掉这个页面了'); return stop(); }
    if (s.qr_ready && !$('qr').src) { $('qr').src = `/dl/${t}/qr?ts=${Date.now()}`; $('box').style.display='block'; msg('等你扫码…'); }
    if (s.status === 'error') { msg('没登上：' + s.error + '。可以再点一次「获取二维码」'); return stop(); }
  } catch(e) {}
  timer = setTimeout(poll, 2000);
}
function stop(){ clearTimeout(timer); $('go').disabled = false; }
$('go').onclick = async () => {
  if (!t) return msg('链接不完整，在机器人里再发一次「登录抖音」');
  $('go').disabled = true; $('qr').removeAttribute('src'); $('box').style.display='none'; msg('正在打开抖音登录页，大约半分钟…');
  try { const r = await api('start', true); if (r.error) { msg(r.error); return stop(); } } catch(e) { msg('网络出错，再点一次'); return stop(); }
  poll();
};
</script></body></html>
