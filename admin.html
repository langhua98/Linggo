<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Linggo 管理后台</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@600&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F7F4EF;--surface:#fff;--surface-2:#F1EFE9;--border:rgba(0,0,0,.09);
  --text:#1C1917;--text-2:#78716C;--text-3:#A8A29E;
  --accent:#2563EB;--accent-d:#EFF6FF;
  --green:#16A34A;--green-d:#DCFCE7;
  --purple:#7C3AED;--purple-d:#EDE9FE;
  --amber:#D97706;--amber-d:#FEF3C7;
  --rose:#DC2626;--rose-d:#FEE2E2;
  --r:12px;--r-lg:18px;
  --sh:0 1px 3px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.04);
  --sh-md:0 4px 8px rgba(0,0,0,.08),0 2px 4px rgba(0,0,0,.05);
}
.dark{
  --bg:#0D1117;--surface:#161B22;--surface-2:#21262D;--border:rgba(255,255,255,.08);
  --text:#E6EDF3;--text-2:#8B949E;--text-3:#484F58;
  --accent:#58A6FF;--accent-d:#1C2D3F;
  --green:#3FB950;--green-d:#12261E;
  --purple:#BC8CFF;--purple-d:#2A1A4A;
  --amber:#E3B341;--amber-d:#2D1E0A;
  --rose:#FF7B9C;--rose-d:#2D0B12;
}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .2s,color .2s}

/* ── GATE ── */
#gate{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.g-box{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  padding:48px 36px 40px;width:100%;max-width:380px;
  box-shadow:var(--sh-md);text-align:center
}
.g-logo{font-family:'Lora',serif;font-size:32px;color:var(--accent);font-weight:600;letter-spacing:-.5px}
.g-sub{font-size:11px;color:var(--text-3);margin:4px 0 36px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.g-input{
  width:100%;height:48px;padding:0 16px;border:1.5px solid var(--border);border-radius:var(--r);
  background:var(--bg);color:var(--text);font-family:inherit;font-size:15px;
  outline:none;margin-bottom:12px;text-align:center;letter-spacing:.2em;transition:border-color .15s
}
.g-input:focus{border-color:var(--accent)}
.g-btn{
  width:100%;height:48px;border:none;border-radius:var(--r);
  background:linear-gradient(135deg,var(--accent) 0%,#1D4ED8 100%);color:#fff;
  font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;
  transition:opacity .15s,transform .1s;letter-spacing:.02em
}
.g-btn:hover{opacity:.9;transform:translateY(-1px)}
.g-btn:active{transform:translateY(0)}
.g-err{font-size:12px;color:var(--rose);margin-top:10px;min-height:18px;font-weight:700}

/* ── TOPBAR ── */
#dash{display:none}
.top{
  position:sticky;top:0;z-index:20;height:58px;
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:0 24px;display:flex;align-items:center;gap:10px;
  box-shadow:0 1px 8px rgba(0,0,0,.05)
}
.top-logo{font-family:'Lora',serif;font-size:19px;color:var(--accent);font-weight:600}
.top-badge{
  font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  background:var(--accent-d);color:var(--accent);border-radius:6px;padding:2px 9px
}
.top-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.top-ts{font-size:11px;color:var(--text-3);white-space:nowrap}
.tbtn{
  height:32px;padding:0 13px;border-radius:8px;border:1.5px solid var(--border);
  background:none;color:var(--text-2);font-family:inherit;font-size:12px;font-weight:700;
  cursor:pointer;transition:all .15s
}
.tbtn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-d)}
.tbtn.danger{border-color:transparent;background:var(--rose-d);color:var(--rose)}
.tbtn.danger:hover{opacity:.8}

/* ── BODY ── */
.body{max-width:1120px;margin:0 auto;padding:28px 20px 80px}
.sec-hd{
  font-size:11px;font-weight:800;color:var(--text-3);letter-spacing:.1em;text-transform:uppercase;
  margin:28px 0 14px;display:flex;align-items:center;gap:8px
}
.sec-hd:first-child{margin-top:0}
.sec-hd::after{content:'';flex:1;height:1px;background:var(--border)}

/* ── STAT CARDS ── */
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(min-width:700px){.cards{grid-template-columns:repeat(4,1fr)}}
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:20px 18px 16px;box-shadow:var(--sh);position:relative;overflow:hidden;
  transition:transform .15s,box-shadow .15s
}
.card:hover{transform:translateY(-2px);box-shadow:var(--sh-md)}
.c-stripe{position:absolute;inset:0 0 auto 0;height:3px;border-radius:var(--r) var(--r) 0 0}
.c-icon{
  width:38px;height:38px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;font-size:19px;margin-bottom:14px
}
.c-val{font-size:28px;font-weight:800;line-height:1.1;margin-bottom:3px}
.c-lbl{font-size:12px;color:var(--text-3);font-weight:700}
.c-sub{font-size:11px;color:var(--text-3);margin-top:6px;font-weight:500;min-height:16px}
.up{color:var(--green);font-weight:800}
.dn{color:var(--rose);font-weight:800}
.eq{color:var(--text-3);font-weight:700}

/* ── CHARTS ── */
.charts-grid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:760px){.charts-grid{grid-template-columns:3fr 2fr}}
.chart-box{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:20px;box-shadow:var(--sh)
}
.ch-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.ch-hd h3{font-size:13px;font-weight:700}
.ch-leg{font-size:11px;color:var(--text-3)}
.ch-empty{height:120px;display:flex;align-items:center;justify-content:center;color:var(--text-3);font-size:13px}
.bars{display:flex;align-items:flex-end;gap:2px;height:120px;padding-bottom:20px}
.bw{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;position:relative}
.b{width:100%;border-radius:3px 3px 0 0;min-height:2px;position:relative;cursor:pointer;transition:opacity .15s}
.b:hover{opacity:.85!important}
.b:hover .btip{display:block}
.btip{
  display:none;position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);
  background:var(--text);color:var(--surface);font-size:11px;font-weight:700;
  border-radius:6px;padding:3px 8px;white-space:nowrap;z-index:10;pointer-events:none
}
.bl{font-size:9px;color:var(--text-3);position:absolute;bottom:0;left:50%;transform:translateX(-50%);white-space:nowrap}

/* ── TABLE ── */
.table-box{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  box-shadow:var(--sh);overflow:hidden
}
.tbl-hd{
  padding:14px 20px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between
}
.tbl-hd h3{font-size:13px;font-weight:700}
.tbl-sub{font-size:11px;color:var(--text-3)}
table{width:100%;border-collapse:collapse}
th{
  padding:10px 20px;text-align:left;font-size:11px;font-weight:700;color:var(--text-3);
  background:var(--surface-2);border-bottom:1px solid var(--border);
  letter-spacing:.05em;text-transform:uppercase
}
td{padding:11px 20px;border-bottom:1px solid var(--border);font-size:13px;color:var(--text-2)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--surface-2)}
.td-em{color:var(--text);font-weight:600}
.tag{display:inline-block;font-size:10px;font-weight:800;padding:2px 8px;border-radius:6px;letter-spacing:.04em}

/* ── MINI STATS ── */
.mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(min-width:700px){.mini-grid{grid-template-columns:repeat(4,1fr)}}
.mini{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:16px;box-shadow:var(--sh);display:flex;align-items:center;gap:14px
}
.mini-ico{font-size:24px;flex-shrink:0}
.mini-val{font-size:22px;font-weight:800;line-height:1.1}
.mini-lbl{font-size:11px;color:var(--text-3);font-weight:600;margin-top:2px}

/* ── INFO ── */
.info{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:14px 20px;font-size:12px;color:var(--text-3);line-height:1.6;margin-top:28px
}
</style>
</head>
<body>

<!-- GATE -->
<div id="gate">
  <div class="g-box">
    <div class="g-logo">Linggo</div>
    <div class="g-sub">Admin Dashboard</div>
    <input class="g-input" type="password" id="g-pwd" placeholder="管理密码" autocomplete="off">
    <button class="g-btn" id="g-btn">进入后台 →</button>
    <div class="g-err" id="g-err"></div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dash">
  <div class="top">
    <span class="top-logo">Linggo</span>
    <span class="top-badge">Admin</span>
    <div class="top-r">
      <span class="top-ts" id="ts"></span>
      <button class="tbtn" id="dm-btn">🌙</button>
      <button class="tbtn" id="ref-btn">↻ 刷新</button>
      <button class="tbtn danger" id="out-btn">退出</button>
    </div>
  </div>

  <div class="body">

    <div class="sec-hd">数据总览</div>
    <div class="cards">
      <div class="card">
        <div class="c-stripe" style="background:var(--accent)"></div>
        <div class="c-icon" style="background:var(--accent-d)">👤</div>
        <div class="c-val" id="s-users" style="color:var(--accent)">—</div>
        <div class="c-lbl">注册用户</div>
        <div class="c-sub" id="s-new7"></div>
      </div>
      <div class="card">
        <div class="c-stripe" style="background:var(--purple)"></div>
        <div class="c-icon" style="background:var(--purple-d)">📖</div>
        <div class="c-val" id="s-vocab" style="color:var(--purple)">—</div>
        <div class="c-lbl">生词总数</div>
        <div class="c-sub" id="s-vocab-u"></div>
      </div>
      <div class="card">
        <div class="c-stripe" style="background:var(--green)"></div>
        <div class="c-icon" style="background:var(--green-d)">📅</div>
        <div class="c-val" id="s-today" style="color:var(--green)">—</div>
        <div class="c-lbl">今日访问</div>
        <div class="c-sub" id="s-trend"></div>
      </div>
      <div class="card">
        <div class="c-stripe" style="background:var(--amber)"></div>
        <div class="c-icon" style="background:var(--amber-d)">🌐</div>
        <div class="c-val" id="s-total" style="color:var(--amber)">—</div>
        <div class="c-lbl">累计访问</div>
        <div class="c-sub" id="s-fc-sub"></div>
      </div>
    </div>

    <div class="sec-hd">趋势图表</div>
    <div class="charts-grid">
      <div class="chart-box">
        <div class="ch-hd">
          <h3>📈 近 30 天访问量</h3>
          <span class="ch-leg" id="v-leg"></span>
        </div>
        <div class="ch-empty" id="v-empty">加载中…</div>
        <div class="bars" id="v-bars" style="display:none"></div>
      </div>
      <div class="chart-box">
        <div class="ch-hd">
          <h3>👤 新用户注册</h3>
          <span class="ch-leg" id="sg-leg"></span>
        </div>
        <div class="ch-empty" id="sg-empty">加载中…</div>
        <div class="bars" id="sg-bars" style="display:none"></div>
      </div>
    </div>

    <div class="sec-hd">最近注册用户</div>
    <div class="table-box">
      <div class="tbl-hd">
        <h3>用户列表</h3>
        <span class="tbl-sub">最近 8 名</span>
      </div>
      <table>
        <thead><tr><th>邮箱</th><th>注册时间</th><th>状态</th></tr></thead>
        <tbody id="u-tbody">
          <tr><td colspan="3" style="text-align:center;padding:24px;color:var(--text-3)">加载中…</td></tr>
        </tbody>
      </table>
    </div>

    <div class="sec-hd">学习活动</div>
    <div class="mini-grid">
      <div class="mini">
        <div class="mini-ico">🔖</div>
        <div><div class="mini-val" id="m-vu" style="color:var(--purple)">—</div><div class="mini-lbl">收藏生词用户数</div></div>
      </div>
      <div class="mini">
        <div class="mini-ico">🃏</div>
        <div><div class="mini-val" id="m-fc" style="color:var(--amber)">—</div><div class="mini-lbl">闪卡复习总次数</div></div>
      </div>
      <div class="mini">
        <div class="mini-ico">🎓</div>
        <div><div class="mini-val" id="m-flu" style="color:var(--green)">—</div><div class="mini-lbl">参与闪卡用户数</div></div>
      </div>
      <div class="mini">
        <div class="mini-ico">📊</div>
        <div><div class="mini-val" id="m-avg" style="color:var(--accent)">—</div><div class="mini-lbl">人均生词数</div></div>
      </div>
    </div>

    <div class="info">ℹ️ &nbsp;数据来自 Supabase，每次刷新获取最新统计。访客数据按天聚合，同一用户每天只计一次。每 5 分钟自动刷新。</div>

  </div>
</div>

<script>
const SB_URL  = 'https://ueskojxtupmxwolzxdxa.supabase.co';
const SB_KEY  = 'sb_publishable_-hbkl0aTVPGCfSL8rk6WPQ_mzGQ52O-';
const ADMIN_PW = 'linggo2025';
const GATE_KEY = 'linggo_admin_ok';
const DM_KEY   = 'linggo_dark';

async function callRpc(fn, params={}){
  const r = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`,{
    method:'POST',
    headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY},
    body:JSON.stringify(params)
  });
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}

// ── GATE
function checkGate(){ return sessionStorage.getItem(GATE_KEY)==='1'; }
document.getElementById('g-btn').onclick = doLogin;
document.getElementById('g-pwd').onkeydown = e=>{ if(e.key==='Enter') doLogin(); };
function doLogin(){
  if(document.getElementById('g-pwd').value === ADMIN_PW){
    sessionStorage.setItem(GATE_KEY,'1');
    showDash();
  } else {
    document.getElementById('g-err').textContent = '密码错误，请重试';
    document.getElementById('g-pwd').value = '';
    document.getElementById('g-pwd').focus();
  }
}
function showDash(){
  document.getElementById('gate').style.display='none';
  document.getElementById('dash').style.display='block';
  loadStats();
}
if(checkGate()) showDash();

// ── DARK MODE
const dmBtn = document.getElementById('dm-btn');
function applyDark(on){
  document.documentElement.classList.toggle('dark', on);
  dmBtn.textContent = on ? '☀️' : '🌙';
  localStorage.setItem(DM_KEY, on?'1':'0');
}
dmBtn.onclick = ()=> applyDark(!document.documentElement.classList.contains('dark'));
applyDark(localStorage.getItem(DM_KEY)==='1');

// ── CONTROLS
document.getElementById('out-btn').onclick = ()=>{ sessionStorage.removeItem(GATE_KEY); location.reload(); };
document.getElementById('ref-btn').onclick = loadStats;
setInterval(()=>{ if(checkGate()) loadStats(); }, 5*60*1000);

// ── LOAD
async function loadStats(){
  const btn = document.getElementById('ref-btn');
  btn.textContent='加载中…'; btn.disabled=true;
  try{
    const d = await callRpc('get_admin_stats');

    anim('s-users', d.total_users??0);
    anim('s-vocab',  d.total_vocab??0);
    anim('s-today',  d.today_visits??0);
    anim('s-total',  d.total_visits??0);

    const n7 = d.new_users_7d??0;
    document.getElementById('s-new7').innerHTML = `<span class="up">+${n7}</span> 本周新增`;

    const vu = d.vocab_users??0;
    document.getElementById('s-vocab-u').textContent = `${vu} 位用户有收藏`;

    const tod=d.today_visits??0, yes=d.yesterday_visits??0;
    const tEl = document.getElementById('s-trend');
    if(yes===0){
      tEl.innerHTML='<span class="eq">— 昨日暂无数据</span>';
    } else {
      const diff=tod-yes, pct=Math.round(Math.abs(diff)/yes*100);
      if(diff>0)      tEl.innerHTML=`<span class="up">↑${pct}%</span> 较昨日`;
      else if(diff<0) tEl.innerHTML=`<span class="dn">↓${pct}%</span> 较昨日`;
      else            tEl.innerHTML='<span class="eq">= 与昨日持平</span>';
    }

    const fcr = d.fc_reviews??0;
    document.getElementById('s-fc-sub').textContent = `${fcr} 次闪卡复习`;

    document.getElementById('m-vu').textContent  = vu;
    document.getElementById('m-fc').textContent  = fcr;
    document.getElementById('m-flu').textContent = d.fc_learners??0;
    document.getElementById('m-avg').textContent = vu>0?Math.round((d.total_vocab??0)/vu):0;

    renderBars('v-bars','v-empty','v-leg',   d.daily_visits||[],  'var(--accent)', '次');
    renderBars('sg-bars','sg-empty','sg-leg', d.daily_signups||[], 'var(--green)',  '人');

    renderUsers(d.recent_users||[]);

    const now = new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
    document.getElementById('ts').textContent = now+' 更新';
  }catch(e){
    console.error(e);
    document.getElementById('v-empty').textContent='加载失败：'+e.message;
  }finally{
    btn.textContent='↻ 刷新'; btn.disabled=false;
  }
}

// ── ANIMATED COUNTER
function anim(id, target){
  const el=document.getElementById(id);
  const from=parseInt((el.textContent||'0').replace(/\D/g,''))||0;
  const dur=700, t0=performance.now();
  (function step(t){
    const p=Math.min((t-t0)/dur,1), e=1-Math.pow(1-p,3);
    el.textContent=Math.round(from+(target-from)*e).toLocaleString('zh-CN');
    if(p<1) requestAnimationFrame(step);
  })(t0);
}

// ── BAR CHART
function renderBars(barsId, emptyId, legId, rows, color, unit){
  const bEl=document.getElementById(barsId), eEl=document.getElementById(emptyId), lEl=document.getElementById(legId);
  bEl.innerHTML='';
  if(!rows.length){
    eEl.textContent='暂无数据'; eEl.style.display='flex'; bEl.style.display='none'; return;
  }
  eEl.style.display='none'; bEl.style.display='flex';
  rows.sort((a,b)=>a.date<b.date?-1:1);
  const max=Math.max(...rows.map(r=>r.count),1);
  const total=rows.reduce((s,r)=>s+r.count,0);
  const today=new Date().toISOString().slice(0,10);
  lEl.textContent=`共 ${total} ${unit}`;
  rows.forEach((row,i)=>{
    const pct=Math.max((row.count/max)*100,2), isT=row.date===today;
    const showLbl=rows.length<=10||i%Math.ceil(rows.length/8)===0||isT;
    const w=document.createElement('div'); w.className='bw';
    const b=document.createElement('div'); b.className='b';
    b.style.height=pct+'%'; b.style.background=color;
    b.style.opacity=isT?'1':'0.55';
    if(isT) b.style.boxShadow=`0 0 8px ${color}55`;
    const tip=document.createElement('div'); tip.className='btip';
    tip.textContent=`${row.date}  ${row.count}${unit}`;
    b.appendChild(tip);
    const dl=document.createElement('div'); dl.className='bl';
    if(showLbl){ dl.textContent=isT?'今':row.date.slice(5); if(isT){dl.style.color=color;dl.style.fontWeight='800';} }
    w.appendChild(b); w.appendChild(dl); bEl.appendChild(w);
  });
}

// ── USERS TABLE
function renderUsers(users){
  const tb=document.getElementById('u-tbody');
  if(!users.length){
    tb.innerHTML='<tr><td colspan="3" style="text-align:center;padding:24px;color:var(--text-3)">暂无数据</td></tr>';
    return;
  }
  const now=Date.now();
  tb.innerHTML=users.map(u=>{
    const d=new Date(u.created_at), isNew=now-d<7*864e5;
    return `<tr>
      <td><span class="td-em">${maskEmail(u.email)}</span></td>
      <td>${d.toLocaleDateString('zh-CN',{year:'numeric',month:'short',day:'numeric'})}</td>
      <td>${isNew
        ?'<span class="tag" style="background:var(--green-d);color:var(--green)">新用户</span>'
        :'<span class="tag" style="background:var(--surface-2);color:var(--text-3)">正常</span>'
      }</td>
    </tr>`;
  }).join('');
}

function maskEmail(e){
  if(!e) return '—';
  const [l,d]=e.split('@');
  return l.slice(0,2)+'***@'+(d||'?');
}
</script>
</body>
</html>
