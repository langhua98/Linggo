<style>
:root{--bg:#fffaf5;--card:#fff;--text:#1c1917;--muted:#78716c;--line:#f0e6db;--accent:#ea580c;--danger:#dc2626;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#171412;--card:#221d1a;--text:#f5f0eb;--muted:#a8a29e;--line:#2f2925;--accent:#fb923c;--danger:#f87171;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-text-size-adjust:100%}
header,main{max-width:720px;margin:0 auto;padding:0 16px}
header{padding-top:28px;padding-bottom:8px}
h1{font-size:24px;line-height:1.3;margin:0}
.sub{margin:4px 0 0;color:var(--muted);font-size:14px}
.sub a{color:var(--accent);text-decoration:none}
[hidden]{display:none!important}

main{padding-bottom:48px}
h2{font-size:18px;margin:28px 0 4px}
.hint{color:var(--muted);font-size:14px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-top:16px}
.card p{margin:6px 0}
.err{color:var(--danger);font-size:14px}
.rows{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.row .info{flex:1;min-width:0}
.row .title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta{font-size:13px;color:var(--muted)}
.empty{color:var(--muted);padding:10px 0}
button{font:inherit;font-size:14px;color:var(--accent);background:none;border:1px solid currentColor;border-radius:8px;padding:6px 12px;cursor:pointer;flex:none}
button.danger{color:var(--danger)}
button.link{border:0;padding:0;color:var(--muted);text-decoration:underline}
#login{margin-top:24px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#login p{width:100%;margin:0}
form.rule{display:grid;gap:8px;margin-top:8px}
form.rule label{font-size:14px;color:var(--muted);display:grid;gap:4px}
form.rule input[type=text],form.rule textarea,form.rule select{font:inherit;font-size:15px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);width:100%}
form.rule textarea{min-height:64px;resize:vertical}
form.rule .check{display:flex;gap:8px;align-items:center;color:var(--text)}
form.rule .actions{display:flex;gap:8px;flex-wrap:wrap}
.tag{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:0 8px;margin-right:4px;color:var(--muted)}
.tag.on{color:var(--accent);border-color:currentColor}
.row .words{font-size:13px;color:var(--text);word-break:break-all;white-space:normal}
.row .btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.log .title{white-space:normal}
#key{flex:1;min-width:0;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text)}
</style>
</head>
<body>
<header>
  <h1>小橘🍊视频 · 管理</h1>
  <p class="sub"><a href="/video">去刷视频</a></p>
</header>
<main>
  <form id="login" hidden>
    <p>输入管理密钥：</p>
    <input id="key" type="password" autocomplete="current-password" required>
    <button type="submit">进入</button>
    <p id="login-err" class="err"></p>
  </form>
  <div id="app" hidden>
    <h2>内容过滤规则</h2>
    <p class="hint">规则只由你在这里定：加、改、删、开关。机器人只照着已启用的规则执行，不会自己加规则或扩大条件；没命中任何规则的照常走。
      「过滤」：命中的搜索词不搜、作品不进审核清单、不转；「只标记」：照常进清单，标成⚠️待人工确认，审核时你决定。作品没有文案、规则查不了的，也只标待人工确认。改完马上生效。</p>
    <ul id="rules" class="rows"></ul>
    <form id="rule-form" class="rule card">
      <strong id="rule-form-title">新加一条规则</strong>
      <label>名字<input id="r-name" type="text" maxlength="30" required placeholder="比如：广告"></label>
      <label>关键词（用逗号、顿号或换行分开；文字里包含任意一个就算命中，不分大小写）<textarea id="r-words" required placeholder="比如：代购、私信下单"></textarea></label>
      <label>查哪里<select id="r-scope"><option value="both">搜索词和作品文案都查</option><option value="keyword">只查搜索词</option><option value="caption">只查作品文案</option></select></label>
      <label>命中后<select id="r-action"><option value="filter">过滤（不搜、不进清单、不转）</option><option value="flag">只标记（标成待人工确认，我来决定）</option></select></label>
      <label>命中「只标记」时给我看的提示（可不写）<input id="r-hint" type="text" maxlength="60" placeholder="比如：确认视频里都是成年人再通过"></label>
      <label class="check"><input id="r-enabled" type="checkbox" checked> 启用</label>
      <div class="actions"><button type="submit" id="r-save">加上</button><button type="button" id="r-cancel" class="link" hidden>不改了</button></div>
      <p id="r-err" class="err"></p>
    </form>
    <h2>过滤记录</h2>
    <p class="hint">最近 100 次按规则过滤、标记的记录：命中哪条规则、哪个词，在哪一步，是哪条作品（或哪个搜索词）。</p>
    <ul id="flog" class="rows log"></ul>
    <p><button type="button" id="logout" class="link">退出管理</button></p>
  </div>
</main>
<script>
(function(){
  var KEY_STORE = 'xm-admin-key';
  var key = '';
  try { key = localStorage.getItem(KEY_STORE) || ''; } catch(e){}

  function $(id){ return document.getElementById(id); }
  function el(tag, cls, txt){
    var e = document.createElement(tag);
    if(cls) e.className = cls;
    if(txt != null) e.textContent = txt;
    return e;
  }

  function api(path, body){
    var opts = { headers: { Authorization: 'Bearer ' + key } };
    if(body){
      opts.method = 'POST';
      opts.headers['Content-Type'] = 'application/json';
      opts.body = JSON.stringify(body);
    }
    return fetch('/admin/api/' + path, opts).then(function(r){
      return r.json().catch(function(){ return {}; }).then(function(d){
        if(!r.ok){ var e = new Error(d.error || ('HTTP ' + r.status)); e.status = r.status; throw e; }
        return d;
      });
    });
  }

  var SCOPE = { both: '搜索词和文案', keyword: '只查搜索词', caption: '只查文案' };
  var ACTION = { filter: '过滤', flag: '只标记' };
  var STAGE = { search: '发搜索词时', queue: '排队交给云电脑前', review: '整理审核清单时', transfer: '审核通过、转之前' };
  var RESULT = { filtered: '过滤掉了', flagged: '标了待人工确认', unclear: '查不了，标了待人工确认' };
  var editing = 0;

  function ruleRow(r){
    var li = el('li', 'row');
    var info = el('div', 'info');
    var t = el('div', 'title', r.name);
    info.appendChild(t);
    var m = el('div', 'meta');
    [r.builtin ? '固定规则' : null, r.enabled ? '启用中' : '已停用', SCOPE[r.scope], ACTION[r.action]].forEach(function(x, i){
      if(!x) return;
      m.appendChild(el('span', 'tag' + (i === 1 && r.enabled ? ' on' : ''), x));
    });
    info.appendChild(m);
    info.appendChild(el('div', 'words', '关键词：' + r.words.join('、')));
    li.appendChild(info);
    if(!r.builtin){
      var b = el('div', 'btns');
      var tg = el('button', '', r.enabled ? '停用' : '启用'); tg.type = 'button';
      tg.addEventListener('click', function(){ saveRule({ id: r.id, name: r.name, words: r.words, scope: r.scope, action: r.action, enabled: !r.enabled, hint: r.hint }); });
      var ed = el('button', '', '改'); ed.type = 'button';
      ed.addEventListener('click', function(){ startEdit(r); });
      var rm = el('button', 'danger', '删'); rm.type = 'button';
      rm.addEventListener('click', function(){
        if(!confirm('删掉规则「' + r.name + '」？之后的任务就不再按它过滤。')) return;
        api('filters-delete', { id: r.id }).then(refreshFilters).catch(function(e){ alert('出错了：' + e.message); });
      });
      b.appendChild(tg); b.appendChild(ed); b.appendChild(rm);
      li.appendChild(b);
    }
    return li;
  }

  function refreshFilters(){
    return Promise.all([api('filters'), api('filter-log?limit=100')]).then(function(res){
      var f = res[0], ul = $('rules');
      ul.textContent = '';
      f.builtin.concat(f.rules).forEach(function(r){ ul.appendChild(ruleRow(r)); });
      if(!f.rules.length) ul.appendChild(el('li', 'empty', '你还没加规则：除了上面的固定规则，现在什么都不过滤。'));
      var lg = $('flog');
      lg.textContent = '';
      if(!res[1].log.length){ lg.appendChild(el('li', 'empty', '还没有记录')); return; }
      res[1].log.forEach(function(x){
        var li = el('li', 'row'), info = el('div', 'info');
        info.appendChild(el('div', 'title', (x.rule_name ? '「' + x.rule_name + '」' + (x.word ? '（词：' + x.word + '）' : '') : '没有文案') + ' · ' + (RESULT[x.result] || x.result)));
        info.appendChild(el('div', 'meta', new Date(x.at).toLocaleString() + ' · ' + (STAGE[x.stage] || x.stage) + ' · ' + x.subject));
        if(x.text && x.text !== x.subject) info.appendChild(el('div', 'meta', x.text));
        li.appendChild(info);
        lg.appendChild(li);
      });
    });
  }

  function startEdit(r){
    editing = r ? r.id : 0;
    $('rule-form-title').textContent = r ? '改规则「' + r.name + '」' : '新加一条规则';
    $('r-name').value = r ? r.name : '';
    $('r-words').value = r ? r.words.join('、') : '';
    $('r-scope').value = r ? r.scope : 'both';
    $('r-action').value = r ? r.action : 'filter';
    $('r-enabled').checked = r ? r.enabled : true;
    $('r-hint').value = r ? (r.hint || '') : '';
    $('r-save').textContent = r ? '保存' : '加上';
    $('r-cancel').hidden = !r;
    $('r-err').textContent = '';
    if(r) $('rule-form').scrollIntoView({ behavior: 'smooth' });
  }

  function saveRule(rule){
    return api('filters', rule).then(function(){ startEdit(null); return refreshFilters(); })
      .catch(function(e){ $('r-err').textContent = e.message; });
  }

  $('rule-form').addEventListener('submit', function(e){
    e.preventDefault();
    saveRule({ id: editing || undefined, name: $('r-name').value, words: $('r-words').value, scope: $('r-scope').value,
      action: $('r-action').value, enabled: $('r-enabled').checked, hint: $('r-hint').value });
  });
  $('r-cancel').addEventListener('click', function(){ startEdit(null); });

  function showLogin(msg){
    $('app').hidden = true;
    $('login').hidden = false;
    $('login-err').textContent = msg || '';
  }

  function refresh(){
    return refreshFilters().then(function(){
      $('login').hidden = true;
      $('app').hidden = false;
    }).catch(function(e){
      if(e.status === 401){
        key = '';
        try { localStorage.removeItem(KEY_STORE); } catch(e2){}
        showLogin('管理密钥不对');
      } else {
        showLogin('加载失败：' + e.message);
      }
    });
  }

  $('login').addEventListener('submit', function(e){
    e.preventDefault();
    key = $('key').value.trim();
    try { localStorage.setItem(KEY_STORE, key); } catch(e2){}
    refresh();
  });
  $('logout').addEventListener('click', function(){
    key = '';
    try { localStorage.removeItem(KEY_STORE); } catch(e){}
    showLogin('');
  });

  if(key) refresh(); else showLogin('');
})();
</script>
</body>
</html>
