# 小橘视频：抖音作品转进视频频道、刷视频网页。和小橘音乐（../xiaoju-music/）是两个独立的 Worker，
# 各有各的机器人、各有各的 Durable Object 数据库，不共用任何东西。
name = "xiaoju-video"
main = "worker.js"
compatibility_date = "2026-01-01"
workers_dev = true

# *.html 以文本模块导入（worker.js 里 import VIDEO_PAGE from './video.html'）
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = false

[vars]
# 大文件流式服务（streamer/，部署在 Hugging Face Space）的地址：超过 20 MB 的视频、翻视频频道、转抖音都靠它
STREAMER_URL = "https://langhua1998-douyin-proxy.hf.space"
# 视频频道「小橘视频」（私有频道，没有用户名，只能用数字 id）：抖音视频、频道主发来的视频文件转到这里
VIDEO_CHANNEL_ID = "-1004292843233"

[[durable_objects.bindings]]
name = "LIB"
class_name = "Library"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Library"]

# 每 5 分钟：流式服务重启后没来报到的话，这里自己去问，没转完的再交一次；每 30 分钟：审核单到期、抖音自动同步
[triggers]
crons = ["*/5 * * * *", "*/30 * * * *"]

# 四个 secret 不写在这里（仓库是公开的）；TG_BOT_TOKEN 是「小橘视频」自己的机器人（不是小橘音乐的那个）：
#   wrangler secret put TG_BOT_TOKEN
#   wrangler secret put TG_WEBHOOK_SECRET
#   wrangler secret put ADMIN_KEY
#   wrangler secret put STREAMER_KEY
