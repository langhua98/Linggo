<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>小橘视频</title>
<style>
  :root {
    --bg: #000;
    --fg: #fff;
    --dim: rgba(255, 255, 255, .72);
    --accent: #ff9a3c;
    --shade: linear-gradient(to top, rgba(0, 0, 0, .7), rgba(0, 0, 0, 0));
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif; overflow: hidden; }
  #feed { height: 100dvh; overflow-y: scroll; scroll-snap-type: y mandatory; overscroll-behavior: contain; scrollbar-width: none; }
  #feed::-webkit-scrollbar { display: none; }
  .slide { position: relative; height: 100dvh; scroll-snap-align: start; scroll-snap-stop: always; display: flex;
    align-items: center; justify-content: center; background: #000 center / contain no-repeat; }
  .slide video { width: 100%; height: 100%; object-fit: contain; background: transparent; }
  .info { position: absolute; left: 0; right: 0; bottom: 0; padding: 48px 16px calc(20px + env(safe-area-inset-bottom));
    background: var(--shade); pointer-events: none; }
  .info p { margin: 0; max-height: 7.5em; overflow: hidden; color: var(--dim); white-space: pre-wrap; word-break: break-word; }
  .info .date { font-size: 12px; color: rgba(255, 255, 255, .5); margin-top: 4px; }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: rgba(255, 255, 255, .15); }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); }
  .note { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 10px 16px; border-radius: 10px;
    background: rgba(0, 0, 0, .6); font-size: 14px; text-align: center; max-width: 80%; pointer-events: none; display: none; }
  .note.on { display: block; }
  header { position: fixed; top: 0; left: 0; right: 0; z-index: 2; padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
    display: flex; align-items: center; justify-content: space-between; pointer-events: none;
    background: linear-gradient(to bottom, rgba(0, 0, 0, .45), rgba(0, 0, 0, 0)); }
  header b { font-size: 17px; letter-spacing: .5px; }
  header b span { color: var(--accent); }
  header button { pointer-events: auto; border: 0; border-radius: 16px; padding: 6px 12px; font: inherit; font-size: 13px;
    color: var(--fg); background: rgba(255, 255, 255, .18); }
  header .tools { display: flex; gap: 6px; }
  .acts { position: absolute; right: 10px; bottom: calc(96px + env(safe-area-inset-bottom)); display: flex; flex-direction: column;
    gap: 18px; align-items: center; z-index: 1; }
  .acts button { border: 0; background: none; color: var(--fg); font: inherit; font-size: 12px; display: flex; flex-direction: column;
    align-items: center; gap: 2px; padding: 0; min-width: 44px; text-shadow: 0 1px 3px rgba(0, 0, 0, .6); }
  .acts button span { font-size: 30px; line-height: 1; filter: drop-shadow(0 1px 3px rgba(0, 0, 0, .5)); }
  .acts button.on span { animation: pop .3s; }
  @keyframes pop { 50% { transform: scale(1.3); } }
  #panel { position: fixed; inset: 0; z-index: 5; background: #0d0d0d; display: none; flex-direction: column; }
  #panel.on { display: flex; }
  #panel .top { display: flex; align-items: center; justify-content: space-between;
    padding: calc(10px + env(safe-area-inset-top)) 16px 10px; border-bottom: 1px solid rgba(255, 255, 255, .08); }
  #panel .top b { font-size: 16px; }
  #panel .top button { border: 0; background: rgba(255, 255, 255, .12); color: var(--fg); border-radius: 16px; padding: 6px 12px; font: inherit; font-size: 13px; }
  #grid { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding: 2px;
    align-content: start; padding-bottom: env(safe-area-inset-bottom); }
  #grid a { position: relative; aspect-ratio: 9 / 16; background: #222; display: block; overflow: hidden; }
  #grid img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #grid a i { color: var(--fg); position: absolute; left: 6px; bottom: 4px; font-style: normal; font-size: 12px; text-shadow: 0 1px 2px #000; }
  #grid p { grid-column: 1 / -1; text-align: center; color: var(--dim); padding: 40px 16px; margin: 0; }
  #toast { position: fixed; left: 50%; bottom: calc(40px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 6;
    background: rgba(40, 40, 40, .95); padding: 10px 16px; border-radius: 10px; font-size: 14px; max-width: calc(100% - 32px);
    text-align: center; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.on { opacity: 1; }
  #empty { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px;
    text-align: center; color: var(--dim); }
</style>
</head>
<body>
<header><b><span>小橘</span>视频</b><div class="tools"><button id="histBtn" type="button">🕘 历史</button><button id="likeBtn" type="button">❤️ 喜欢</button><button id="sound" type="button">🔇 声音</button></div></header>
<div id="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle"><div class="top"><b id="panelTitle"></b><button id="panelClose" type="button">关闭</button></div><div id="grid"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<main id="feed" aria-label="视频列表"></main>
<div id="empty">加载中…</div>
<script>
(() => {
  const feed = document.getElementById('feed');
  const empty = document.getElementById('empty');
  const soundBtn = document.getElementById('sound');
  // 浏览器只让静音的视频自动播放；点一下才能开声音，开了以后之后的都带声音
  let muted = true;
  let videos = [];
  let current = -1;
  const loaded = new Set(); // 装了视频地址的几条
  // 浏览历史、喜欢：存在这台设备的浏览器里（消息号列表，新的在前）
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k) || '[]').filter(Number.isInteger); } catch { return []; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };
  const HISTORY_MAX = 500;
  // 网页口令：频道主在机器人里拿的链接 /video#key=… 打开一次就记住；有口令才显示 💔（会删掉频道原帖）
  let ownerKey = '';
  try {
    const m = /^#key=([0-9a-f]{48})$/.exec(location.hash);
    if (m) { localStorage.setItem('xj_key', m[1]); history.replaceState(null, '', location.pathname); }
    ownerKey = localStorage.getItem('xj_key') || '';
  } catch {}
  let seen = store.get('xj_history');
  let likes = new Set(store.get('xj_likes'));
  const toastEl = document.getElementById('toast');
  let toastTimer;
  function toast(t) {
    toastEl.textContent = t;
    toastEl.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('on'), 2600);
  }
  function remember(id) {
    seen = [id, ...seen.filter(x => x !== id)].slice(0, HISTORY_MAX);
    store.set('xj_history', seen);
  }
  // 当前这条往前留 1 条、往后留 2 条的视频地址，其余的卸掉省流量；下一条提前缓冲，滑过去就能放
  const BEHIND = 1, AHEAD = 2;
  // 封面只给附近的几条装：两千多条一起要封面，浏览器和流式服务都会被堵住，正在看的视频反而排在后面
  const COVERS = 4;

  function fmtDate(sec) {
    if (!sec) return '';
    const d = new Date(sec * 1000);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  function build() {
    feed.textContent = '';
    videos.forEach((v, i) => {
      const s = document.createElement('section');
      s.className = 'slide';
      s.dataset.i = i;
      const video = document.createElement('video');
      video.playsInline = true;
      video.loop = true;
      video.muted = muted;
      video.preload = 'none';
      video.setAttribute('webkit-playsinline', '');
      s.appendChild(video);
      const info = document.createElement('div');
      info.className = 'info';
      const date = document.createElement('div');
      date.className = 'date';
      date.textContent = fmtDate(v.date);
      info.append(date);
      const bar = document.createElement('div');
      bar.className = 'bar';
      bar.appendChild(document.createElement('i'));
      const note = document.createElement('div');
      note.className = 'note';
      const acts = document.createElement('div');
      acts.className = 'acts';
      const like = document.createElement('button');
      like.type = 'button';
      like.className = 'like';
      const paintLike = () => {
        const on = likes.has(v.id);
        like.innerHTML = `<span>${on ? '❤️' : '🤍'}</span>${on ? '已喜欢' : '喜欢'}`;
        like.setAttribute('aria-pressed', String(on));
        like.classList.toggle('on', on);
      };
      paintLike();
      like.addEventListener('click', e => {
        e.stopPropagation();
        if (likes.has(v.id)) likes.delete(v.id); else likes = new Set([v.id, ...likes]);
        store.set('xj_likes', [...likes]);
        paintLike();
      });
      const hb = document.createElement('button');
      hb.type = 'button';
      hb.className = 'hb';
      hb.innerHTML = '<span>💔</span>心碎';
      hb.setAttribute('aria-label', '心碎：删掉这条视频的频道原帖');
      hb.addEventListener('click', e => {
        e.stopPropagation();
        heartbreak(i);
      });
      acts.append(like);
      if (ownerKey) acts.append(hb);
      s.append(info, bar, note, acts);
      video.addEventListener('timeupdate', () => {
        if (video.duration) bar.firstChild.style.width = (video.currentTime / video.duration * 100) + '%';
      });
      video.addEventListener('playing', () => { video.dataset.tries = '0'; note.classList.remove('on'); });
      video.addEventListener('error', () => retry(i));
      s.addEventListener('click', () => {
        if (muted) return setMuted(false);
        if (video.paused) video.play().catch(() => {}); else video.pause();
      });
      feed.appendChild(s);
    });
  }

  // 大视频走流式服务：它在休眠时 Worker 回 503，过一会儿再试
  function retry(i) {
    const s = feed.children[i];
    if (!s || i !== current) return;
    const video = s.querySelector('video');
    const note = s.querySelector('.note');
    const tries = Number(video.dataset.tries || 0) + 1;
    video.dataset.tries = tries;
    if (tries > 12) {
      note.textContent = '这个视频暂时放不了，上滑看下一个';
      note.classList.add('on');
      return;
    }
    note.textContent = '视频服务正在唤醒，稍等…';
    note.classList.add('on');
    setTimeout(() => {
      if (i !== current) return;
      video.src = `/vf/${videos[i].id}?r=${tries}`;
      video.play().catch(() => {});
    }, 10000);
  }

  // 心碎：确认后让 Worker 删掉频道原帖（它会告诉机器人），这里马上藏起来、跳到下一条
  function heartbreak(i) {
    const v = videos[i];
    if (!v || v.gone) return;
    if (!confirm('删掉这条视频？频道里的原帖也会删掉，找不回来。')) return;
    fetch('/api/heartbreak', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: v.id, key: ownerKey }) })
      .then(r => r.json().then(j => ({ status: r.status, ok: r.ok, j })))
      .then(({ status, ok, j }) => {
        if (status === 403) {
          // 口令换过了：收起所有 💔，要用就去机器人拿新链接
          try { localStorage.removeItem('xj_key'); } catch {}
          ownerKey = '';
          document.querySelectorAll('.acts .hb').forEach(b => b.remove());
          return toast('口令过期了：在机器人里发「网页口令」拿新链接');
        }
        if (!ok) return toast(j.error || '没删成，稍后再试');
        v.gone = true;
        likes.delete(v.id);
        store.set('xj_likes', [...likes]);
        const s = feed.children[i];
        const video = s.querySelector('video');
        video.pause();
        video.removeAttribute('src');
        video.load();
        loaded.delete(i);
        const next = nearest(i);
        s.style.display = 'none';
        current = -1;
        if (next >= 0) {
          feed.children[next].scrollIntoView();
          activate(next);
        }
        toast(j.deleted === false ? '💔 已从视频池拿掉，原帖稍后自动删' : '💔 已删掉，频道原帖也删了');
      })
      .catch(() => toast('没删成，检查网络后再试'));
  }

  // 离 i 最近、还在的那条（先往后找）
  function nearest(i) {
    for (let d = 1; d < videos.length; d++) {
      if (i + d < videos.length && !videos[i + d].gone) return i + d;
      if (i - d >= 0 && !videos[i - d].gone) return i - d;
    }
    return -1;
  }

  // 历史、喜欢：封面网格，点一下跳过去
  const panel = document.getElementById('panel');
  const grid = document.getElementById('grid');
  function openPanel(title, ids) {
    grid.textContent = '';
    const index = new Map(videos.map((v, i) => [v.id, i]));
    const shown = ids.filter(id => index.has(id) && !videos[index.get(id)].gone);
    document.getElementById('panelTitle').textContent = `${title}（${shown.length}）`;
    if (!shown.length) {
      const p = document.createElement('p');
      p.textContent = title.includes('喜欢') ? '还没有喜欢的视频，点视频右边的 🤍 收藏' : '还没有看过的视频';
      grid.appendChild(p);
    }
    for (const id of shown) {
      const i = index.get(id);
      const a = document.createElement('a');
      a.href = `#${id}`;
      const img = document.createElement('img');
      img.loading = 'lazy';
      img.alt = '';
      img.src = `/vp/${id}`;
      const d = document.createElement('i');
      d.textContent = fmtDur(videos[i].duration);
      a.append(img, d);
      a.addEventListener('click', e => {
        e.preventDefault();
        closePanel();
        feed.children[i].scrollIntoView();
        activate(i);
      });
      grid.appendChild(a);
    }
    panel.classList.add('on');
    const s = feed.children[current];
    if (s) s.querySelector('video').pause();
  }
  function closePanel() {
    panel.classList.remove('on');
    const s = feed.children[current];
    if (s) s.querySelector('video').play().catch(() => {});
  }
  document.getElementById('panelClose').addEventListener('click', closePanel);
  document.getElementById('histBtn').addEventListener('click', () => openPanel('🕘 浏览历史', seen));
  document.getElementById('likeBtn').addEventListener('click', () => openPanel('❤️ 喜欢', [...likes]));
  function fmtDur(sec) {
    sec = Number(sec) || 0;
    return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;
  }

  function setMuted(m) {
    muted = m;
    soundBtn.textContent = m ? '🔇 声音' : '🔊 声音';
    for (const v of feed.querySelectorAll('video')) v.muted = m;
    const s = feed.children[current];
    if (s) s.querySelector('video').play().catch(() => {});
  }
  soundBtn.addEventListener('click', () => setMuted(!muted));

  function activate(i) {
    if (i === current) return;
    current = i;
    // 只动附近的和上次装过地址的，不用每次把两千多条全走一遍
    for (let j = Math.max(0, i - COVERS); j <= Math.min(videos.length - 1, i + COVERS); j++) {
      const s = feed.children[j];
      if (!s.style.backgroundImage) s.style.backgroundImage = `url(/vp/${videos[j].id})`;
    }
    for (const j of [...loaded]) {
      if (j >= i - BEHIND && j <= i + AHEAD) continue;
      const video = feed.children[j].querySelector('video');
      video.pause();
      video.removeAttribute('src');
      video.load();
      loaded.delete(j);
    }
    const order = [i];
    for (let k = 1; k <= AHEAD; k++) order.push(i + k);
    for (let k = 1; k <= BEHIND; k++) order.push(i - k);
    if (videos[i] && !videos[i].gone) remember(videos[i].id);
    for (const j of order.filter(j => j >= 0 && j < videos.length && !videos[j].gone)) {
      const video = feed.children[j].querySelector('video');
      // 先给当前这条地址，再给后面的：浏览器按顺序开始下载
      video.preload = j === i || j === i + 1 ? 'auto' : 'metadata';
      if (!video.getAttribute('src')) video.src = `/vf/${videos[j].id}`;
      loaded.add(j);
      if (j === i) {
        video.muted = muted;
        video.play().catch(() => {});
      } else {
        video.pause();
      }
    }
    try { history.replaceState(null, '', `#${videos[i].id}`); } catch {}
  }

  const io = new IntersectionObserver(entries => {
    for (const e of entries) if (e.isIntersecting && e.intersectionRatio > 0.6) activate(Number(e.target.dataset.i));
  }, { root: feed, threshold: [0.6] });

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      if (panel.classList.contains('on')) return;
      const step = e.key === 'ArrowDown' ? 1 : -1;
      let next = current + step;
      while (next >= 0 && next < videos.length && videos[next].gone) next += step;
      if (next >= 0 && next < videos.length) feed.children[next].scrollIntoView({ behavior: 'smooth' });
    } else if (e.key === 'Escape' && panel.classList.contains('on')) {
      closePanel();
    } else if (e.key === ' ') {
      e.preventDefault();
      feed.children[current] && feed.children[current].click();
    }
  });

  document.addEventListener('visibilitychange', () => {
    const s = feed.children[current];
    if (s && document.hidden) s.querySelector('video').pause();
  });

  fetch('/api/videos').then(r => r.json()).then(j => {
    videos = j.videos || [];
    if (!videos.length) { empty.textContent = '频道里还没有视频'; return; }
    empty.remove();
    build();
    for (const s of feed.children) io.observe(s);
    // 链接带 #消息号 就从那条开始
    const start = videos.findIndex(v => `#${v.id}` === location.hash);
    if (start > 0) feed.children[start].scrollIntoView();
  }).catch(() => { empty.textContent = '加载失败，请刷新重试'; });
})();
</script>
</body>
</html>
